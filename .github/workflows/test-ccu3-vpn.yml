name: Test CCU3 via WireGuard VPN

on:
  workflow_dispatch:

# Hinweis zur AllowedIPs-Wahl:
# Der Speedport Smart 3 leitet den WireGuard-Traffic ins Heimnetz 192.168.2.0/24.
# AllowedIPs=192.168.2.0/24 routet ausschliesslich das Heimnetz ueber WireGuard.
# Das vermeidet das Policy-Routing-Problem, das bei AllowedIPs=0.0.0.0/0 auftritt:
# wg-quick legt bei 0.0.0.0/0 eine separate Routing-Tabelle an und fuegt
# fwmark-basierte ip-rules hinzu. Das kann dazu fuehren, dass der GitHub Runner
# keinen Handshake bekommt, weil der Endpoint-Traffic (UDP) ueber sich selbst
# geroutet wird, bevor die VPN-Verbindung steht.
# Mit 192.168.2.0/24 bleibt das Default-Gateway erhalten, der Handshake
# gelingt problemlos und danach ist 192.168.2.109 erreichbar.

jobs:
  test-ccu3-vpn:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      WG_INTERFACE: wg-ci
      WG_CONFIG_PATH: /tmp/wg-ci.conf
      CCU_IP: ${{ vars.CCU_IP }}
      # AllowedIPs: Nur Heimnetz routen, kein Default-Route-Hijack.
      # Wert kann ueber GitHub Variable WIREGUARD_ALLOWED_IPS ueberschrieben werden.
      # Standard: 192.168.2.0/24
      WIREGUARD_ALLOWED_IPS: ${{ vars.WIREGUARD_ALLOWED_IPS || '192.168.2.0/24' }}
      WIREGUARD_KEEPALIVE: ${{ vars.WIREGUARD_KEEPALIVE || '25' }}
      # Optional: true erzwingt DynDNS/FQDN im Endpoint statt fixer IP.
      WIREGUARD_REQUIRE_DYNDNS_ENDPOINT: ${{ vars.WIREGUARD_REQUIRE_DYNDNS_ENDPOINT || 'false' }}
      # Homematic IP XML-RPC Port auf der CCU3 (Standard: 2010).
      CCU_HMIP_PORT: ${{ vars.CCU_HMIP_PORT || '2010' }}
      # Optional: true erzwingt, dass der HmIP-Port erreichbar sein muss.
      CCU_REQUIRE_HMIP_PORT: ${{ vars.CCU_REQUIRE_HMIP_PORT || 'false' }}
      # XML-API Endpoint auf der CCU3 (Add-on).
      CCU_XMLAPI_PATH: ${{ vars.CCU_XMLAPI_PATH || '/addons/xmlapi/statelist.cgi' }}
      # Optional: XML-API Security Token (sid). Wenn gesetzt, wird sid-basierte Authentifizierung verwendet.
      CCU_XMLAPI_SID: ${{ secrets.CCU_XMLAPI_SID }}
      # Regex fuer die Erkennung von Keypad-Geraeten ueber Name/Typ.
      CCU_KEYPAD_MATCH_REGEX: ${{ vars.CCU_KEYPAD_MATCH_REGEX || 'WKP|KEYPAD|KeyPad|TASTATUR' }}
      # Optional: Serielle Basisadresse des Keypads (z. B. 002E9F29993E22) fuer Fallback-Matching.
      CCU_KEYPAD_SERIAL: ${{ vars.CCU_KEYPAD_SERIAL || '' }}
      # Optional: true erzwingt mindestens ein Keypad-Match in der XML-API-Auswertung.
      CCU_REQUIRE_KEYPAD_MATCH: ${{ vars.CCU_REQUIRE_KEYPAD_MATCH || 'false' }}
      # Optional: true aktiviert das Setzen eines neuen Zugangscodes am Keypad.
      CCU_KEYPAD_APPLY_CODE: ${{ vars.CCU_KEYPAD_APPLY_CODE || 'false' }}
      # Zielkanal fuer den Zugangscode (Standard: 5).
      CCU_KEYPAD_UPDATE_CHANNEL: ${{ vars.CCU_KEYPAD_UPDATE_CHANNEL || '5' }}
      # Neuer Zugangscode fuer den Zielkanal (als Secret hinterlegen).
      CCU_KEYPAD_NEW_CODE: ${{ secrets.CCU_KEYPAD_NEW_CODE }}

    steps:
      - name: Install WireGuard and tools
        run: |
          if ! command -v wg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wireguard iproute2 iputils-ping curl netcat-openbsd
          fi

      - name: Validate required input
        env:
          WG_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          WG_PEER_PUBLIC_KEY: ${{ vars.WIREGUARD_PEER_PUBLIC_KEY }}
          WG_ADDRESS: ${{ vars.WIREGUARD_ADDRESS }}
          WG_ENDPOINT: ${{ vars.WIREGUARD_ENDPOINT }}
          WG_REQUIRE_DYNDNS_ENDPOINT: ${{ vars.WIREGUARD_REQUIRE_DYNDNS_ENDPOINT || 'false' }}
        run: |
          set -euo pipefail
          ERRORS=0
          check_var() {
            local name="$1" value="$2" kind="$3"
            if [ -z "${value}" ]; then
              echo "::error::${kind} '${name}' ist nicht gesetzt oder leer."
              ERRORS=$((ERRORS + 1))
            else
              echo "${kind} '${name}': OK"
            fi
          }
          check_var "CCU_IP"                    "${CCU_IP}"                  "GitHub Variable"
          check_var "WIREGUARD_ALLOWED_IPS"     "${WIREGUARD_ALLOWED_IPS}"   "GitHub Variable"
          check_var "WIREGUARD_ADDRESS"         "${WG_ADDRESS}"              "GitHub Variable"
          check_var "WIREGUARD_ENDPOINT"        "${WG_ENDPOINT}"             "GitHub Variable"
          check_var "CCU_HMIP_PORT"             "${CCU_HMIP_PORT}"           "GitHub Variable"
          check_var "CCU_REQUIRE_HMIP_PORT"     "${CCU_REQUIRE_HMIP_PORT}"   "GitHub Variable"
          check_var "CCU_XMLAPI_PATH"           "${CCU_XMLAPI_PATH}"         "GitHub Variable"
          check_var "CCU_KEYPAD_MATCH_REGEX"    "${CCU_KEYPAD_MATCH_REGEX}"  "GitHub Variable"
          echo "GitHub Variable 'CCU_KEYPAD_SERIAL': ${CCU_KEYPAD_SERIAL:-<leer>}"
          check_var "CCU_REQUIRE_KEYPAD_MATCH"  "${CCU_REQUIRE_KEYPAD_MATCH}" "GitHub Variable"
          check_var "WIREGUARD_PRIVATE_KEY"     "${WG_PRIVATE_KEY}"          "GitHub Secret"
          check_var "WIREGUARD_PEER_PUBLIC_KEY" "${WG_PEER_PUBLIC_KEY}"      "GitHub Variable"
          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::${ERRORS} erforderliche(r) Wert(e) fehlen. Bitte die Repository Secrets und Variables pruefen."
            exit 1
          fi

          # Endpoint-Host aus host:port bzw. [ipv6]:port extrahieren.
          WG_ENDPOINT_HOST=""
          if echo "${WG_ENDPOINT}" | grep -Eq '^\[[^]]+\]:[0-9]+$'; then
            WG_ENDPOINT_HOST="$(echo "${WG_ENDPOINT}" | sed -E 's/^\[([^]]+)\]:([0-9]+)$/\1/')"
          elif echo "${WG_ENDPOINT}" | grep -Eq '^[^:]+:[0-9]+$'; then
            WG_ENDPOINT_HOST="${WG_ENDPOINT%:*}"
          else
            echo "::error::WIREGUARD_ENDPOINT hat kein gueltiges Format. Erwartet: host:port oder [ipv6]:port"
            ERRORS=$((ERRORS + 1))
          fi

          # DynDNS/FQDN-Pruefung: fixer Endpoint per IP ist fehleranfaellig bei wechselnder WAN-IP.
          WG_REQUIRE_DYNDNS_NORMALIZED="$(printf '%s' "${WG_REQUIRE_DYNDNS_ENDPOINT}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "${WG_ENDPOINT_HOST}" ] && echo "${WG_ENDPOINT_HOST}" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]+$'; then
            echo "::warning::WIREGUARD_ENDPOINT verwendet eine feste IP (${WG_ENDPOINT_HOST}). DynDNS/FQDN wird empfohlen, damit WAN-IP-Aenderungen nicht zu Handshake-Fehlern fuehren."
            if [ "${WG_REQUIRE_DYNDNS_NORMALIZED}" = "true" ]; then
              echo "::error::WIREGUARD_REQUIRE_DYNDNS_ENDPOINT=true, aber WIREGUARD_ENDPOINT ist eine feste IP. Bitte DynDNS/FQDN verwenden (z. B. dein-host.ipv64.net:PORT)."
              ERRORS=$((ERRORS + 1))
            fi
          fi

          # Validierung: Keys haben gueltiges WireGuard-Format (Base64, 44 Zeichen, endet auf =)
          if ! printf '%s' "${CCU_HMIP_PORT}" | grep -Eq '^[0-9]+$'; then
            echo "::error::CCU_HMIP_PORT muss numerisch sein (z. B. 2010)."
            ERRORS=$((ERRORS + 1))
          elif [ "${CCU_HMIP_PORT}" -lt 1 ] || [ "${CCU_HMIP_PORT}" -gt 65535 ]; then
            echo "::error::CCU_HMIP_PORT liegt ausserhalb 1-65535."
            ERRORS=$((ERRORS + 1))
          fi
          CCU_REQUIRE_HMIP_PORT_NORMALIZED="$(printf '%s' "${CCU_REQUIRE_HMIP_PORT}" | tr '[:upper:]' '[:lower:]')"
          if [ "${CCU_REQUIRE_HMIP_PORT_NORMALIZED}" != "true" ] && [ "${CCU_REQUIRE_HMIP_PORT_NORMALIZED}" != "false" ]; then
            echo "::error::CCU_REQUIRE_HMIP_PORT muss 'true' oder 'false' sein."
            ERRORS=$((ERRORS + 1))
          fi
          CCU_REQUIRE_KEYPAD_MATCH_NORMALIZED="$(printf '%s' "${CCU_REQUIRE_KEYPAD_MATCH}" | tr '[:upper:]' '[:lower:]')"
          if [ "${CCU_REQUIRE_KEYPAD_MATCH_NORMALIZED}" != "true" ] && [ "${CCU_REQUIRE_KEYPAD_MATCH_NORMALIZED}" != "false" ]; then
            echo "::error::CCU_REQUIRE_KEYPAD_MATCH muss 'true' oder 'false' sein."
            ERRORS=$((ERRORS + 1))
          fi
          CCU_KEYPAD_APPLY_CODE_NORMALIZED="$(printf '%s' "${CCU_KEYPAD_APPLY_CODE}" | tr '[:upper:]' '[:lower:]')"
          if [ "${CCU_KEYPAD_APPLY_CODE_NORMALIZED}" != "true" ] && [ "${CCU_KEYPAD_APPLY_CODE_NORMALIZED}" != "false" ]; then
            echo "::error::CCU_KEYPAD_APPLY_CODE muss 'true' oder 'false' sein."
            ERRORS=$((ERRORS + 1))
          fi
          if [ -n "${CCU_KEYPAD_SERIAL}" ] && ! printf '%s' "${CCU_KEYPAD_SERIAL}" | grep -Eq '^[0-9A-Fa-f]{6,32}$'; then
            echo "::error::CCU_KEYPAD_SERIAL muss alphanumerisch/hex sein (z. B. 002E9F29993E22)."
            ERRORS=$((ERRORS + 1))
          fi
          if ! printf '%s' "${CCU_KEYPAD_UPDATE_CHANNEL}" | grep -Eq '^[0-9]+$'; then
            echo "::error::CCU_KEYPAD_UPDATE_CHANNEL muss numerisch sein (z. B. 5)."
            ERRORS=$((ERRORS + 1))
          elif [ "${CCU_KEYPAD_UPDATE_CHANNEL}" -lt 1 ] || [ "${CCU_KEYPAD_UPDATE_CHANNEL}" -gt 50 ]; then
            echo "::error::CCU_KEYPAD_UPDATE_CHANNEL liegt ausserhalb 1-50."
            ERRORS=$((ERRORS + 1))
          fi
          if [ "${CCU_KEYPAD_APPLY_CODE_NORMALIZED}" = "true" ]; then
            if [ -z "${CCU_KEYPAD_NEW_CODE}" ]; then
              echo "::error::CCU_KEYPAD_APPLY_CODE=true, aber Secret CCU_KEYPAD_NEW_CODE ist leer."
              ERRORS=$((ERRORS + 1))
            elif ! printf '%s' "${CCU_KEYPAD_NEW_CODE}" | grep -Eq '^[0-9]{4,10}$'; then
              echo "::error::CCU_KEYPAD_NEW_CODE muss 4-10 Ziffern enthalten."
              ERRORS=$((ERRORS + 1))
            fi
          fi
          if [ "${CCU_XMLAPI_PATH#'/'}" = "${CCU_XMLAPI_PATH}" ]; then
            echo "::error::CCU_XMLAPI_PATH muss mit '/' beginnen (z. B. /addons/xmlapi/statelist.cgi)."
            ERRORS=$((ERRORS + 1))
          fi

          # Validierung: Keys haben gueltiges WireGuard-Format (Base64, 44 Zeichen, endet auf =)
          WG_KEY_REGEX='^[A-Za-z0-9+/]{43}=$'
          if ! printf '%s' "${WG_PEER_PUBLIC_KEY}" | grep -Eq "${WG_KEY_REGEX}"; then
            echo "::error::WIREGUARD_PEER_PUBLIC_KEY hat kein gueltiges WireGuard-Format (Base64, 44 Zeichen)."
            ERRORS=$((ERRORS + 1))
          fi
          if ! DERIVED_CLIENT_PUBLIC_KEY="$(printf '%s' "${WG_PRIVATE_KEY}" | wg pubkey 2>/dev/null)" || [ -z "${DERIVED_CLIENT_PUBLIC_KEY}" ]; then
            echo "::error::WIREGUARD_PRIVATE_KEY ist kein gueltiger WireGuard-PrivateKey."
            ERRORS=$((ERRORS + 1))
          else
            unset WG_PRIVATE_KEY
            if [ "${DERIVED_CLIENT_PUBLIC_KEY}" = "${WG_PEER_PUBLIC_KEY}" ]; then
              echo "::error::WIREGUARD_PEER_PUBLIC_KEY ist identisch zum abgeleiteten GitHub-Client-PublicKey. Peer und Client muessen unterschiedliche Keys verwenden."
              ERRORS=$((ERRORS + 1))
            else
              echo "Client PublicKey und Peer PublicKey sind unterschiedlich: OK"
            fi
          fi
          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::${ERRORS} Validierungsfehler. Bitte die Repository Secrets und Variables pruefen."
            exit 1
          fi

      - name: Create temporary WireGuard config
        env:
          WG_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          WG_PEER_PUBLIC_KEY: ${{ vars.WIREGUARD_PEER_PUBLIC_KEY }}
          WG_ADDRESS: ${{ vars.WIREGUARD_ADDRESS }}
          WG_ENDPOINT: ${{ vars.WIREGUARD_ENDPOINT }}
          WG_PRESHARED_KEY: ${{ secrets.WIREGUARD_PRESHARED_KEY }}
          WG_DNS: ${{ vars.WIREGUARD_DNS }}
        run: |
          set -euo pipefail
          umask 077
          EFFECTIVE_WIREGUARD_ALLOWED_IPS="${WIREGUARD_ALLOWED_IPS}"
          if printf '%s' "${WIREGUARD_ALLOWED_IPS}" | grep -Eq '(^|[[:space:]]*,[[:space:]]*)0\.0\.0\.0/0([[:space:]]*,[[:space:]]*|$)'; then
            EFFECTIVE_WIREGUARD_ALLOWED_IPS="${CCU_IP}/32"
            echo "::warning::WIREGUARD_ALLOWED_IPS enthaelt 0.0.0.0/0. Fuer den CI-Handshake wird stattdessen ${EFFECTIVE_WIREGUARD_ALLOWED_IPS} verwendet."
          fi
          echo "EFFECTIVE_WIREGUARD_ALLOWED_IPS=${EFFECTIVE_WIREGUARD_ALLOWED_IPS}" >> "$GITHUB_ENV"
          {
            echo "[Interface]"
            echo "PrivateKey = ${WG_PRIVATE_KEY}"
            echo "Address = ${WG_ADDRESS}"
            # MTU 1420: Standardwert fuer WireGuard ueber UDP/IPv4.
            # Verhindert IP-Fragmentierung bei encapsuliertem Traffic.
            echo "MTU = 1420"
            if [ -n "${WG_DNS}" ]; then
              echo "DNS = ${WG_DNS}"
            fi
            echo
            echo "[Peer]"
            echo "PublicKey = ${WG_PEER_PUBLIC_KEY}"
            if [ -n "${WG_PRESHARED_KEY}" ]; then
              echo "PresharedKey = ${WG_PRESHARED_KEY}"
            fi
            # AllowedIPs=192.168.2.0/24: Nur Heimnetz ueber WireGuard routen.
            # Kein Default-Route-Hijack, Handshake-UDP zum Speedport bleibt im normalen Routing.
            echo "AllowedIPs = ${EFFECTIVE_WIREGUARD_ALLOWED_IPS}"
            echo "Endpoint = ${WG_ENDPOINT}"
            echo "PersistentKeepalive = ${WIREGUARD_KEEPALIVE}"
          } > "${WG_CONFIG_PATH}"

      - name: Start WireGuard tunnel
        run: |
          set -euo pipefail
          if sudo wg-quick up "${WG_CONFIG_PATH}"; then
            echo "WG_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "WG_STATUS=FEHLER" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Wait for WireGuard handshake
        if: ${{ env.WG_STATUS == 'OK' }}
        run: |
          set +e
          echo "Warte auf WireGuard-Handshake (max. 30 Sekunden)..."
          HANDSHAKE_OK="false"
          for i in $(seq 1 6); do
            sleep 5
            # latest-handshakes gibt den Unix-Timestamp des letzten Handshakes aus (0 = kein Handshake)
            HANDSHAKE_TS=$(sudo wg show "${WG_INTERFACE}" latest-handshakes 2>/dev/null | awk '{print $2}')
            if [ -n "${HANDSHAKE_TS}" ] && [ "${HANDSHAKE_TS}" != "0" ]; then
              echo "Handshake erfolgreich nach $((i * 5)) Sekunden."
              HANDSHAKE_OK="true"
              break
            fi
            echo "Versuch ${i}/6: noch kein Handshake..."
          done
          if [ "${HANDSHAKE_OK}" = "true" ]; then
            echo "HANDSHAKE_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "HANDSHAKE_STATUS=FEHLER" >> "$GITHUB_ENV"
            echo "::warning::Kein WireGuard-Handshake nach 30 Sekunden. Moegliche Ursachen:"
            echo "::warning::  - Speedport-Endpoint nicht erreichbar (Firewall, Portweiterleitung?)"
            echo "::warning::  - Derselbe Peer wird gleichzeitig vom iPhone verwendet (WireGuard unterstuetzt nur eine aktive Session pro Peer)"
            echo "::warning::  - Falscher PublicKey oder PrivateKey"
            echo "::warning::  - Falscher Endpoint (IP:Port)"
          fi

      - name: VPN diagnostics (non-sensitive)
        if: ${{ always() }}
        env:
          WG_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          WG_EXPECTED_SPEEDPORT_PUBLIC_KEY: ${{ vars.WIREGUARD_SPEEDPORT_PUBLIC_KEY }}
          WG_EXPECTED_CLIENT_PUBLIC_KEY: ${{ vars.WIREGUARD_CLIENT_PUBLIC_KEY }}
          WG_IPHONE_PUBLIC_KEY: ${{ vars.WIREGUARD_IPHONE_PUBLIC_KEY }}
          WG_IPHONE_ENDPOINT: ${{ vars.WIREGUARD_IPHONE_ENDPOINT }}
        run: |
          set +e
          ROOT_CAUSE_CODE="F"
          ROOT_CAUSE_DETAILS="Keine eindeutige Ursache ermittelt."
          CONFIG_VALID="true"
          DNS_OK="true"
          PORT_OK="true"
          PEER_OK="true"
          CLIENT_KEY_OK="true"

          echo "=== WireGuard config check (/tmp/wg-ci.conf, non-sensitive fields only) ==="
          if [ -f "${WG_CONFIG_PATH}" ]; then
            CFG_ADDRESS="$(awk '/^[[:space:]]*Address[[:space:]]*=/{sub(/^[[:space:]]*Address[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"
            CFG_PEER_PUBLIC_KEY="$(awk '/^[[:space:]]*PublicKey[[:space:]]*=/{sub(/^[[:space:]]*PublicKey[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"
            CFG_ENDPOINT="$(awk '/^[[:space:]]*Endpoint[[:space:]]*=/{sub(/^[[:space:]]*Endpoint[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"
            CFG_ALLOWED_IPS="$(awk '/^[[:space:]]*AllowedIPs[[:space:]]*=/{sub(/^[[:space:]]*AllowedIPs[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"
            CFG_KEEPALIVE="$(awk '/^[[:space:]]*PersistentKeepalive[[:space:]]*=/{sub(/^[[:space:]]*PersistentKeepalive[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"

            echo "Interface Address: ${CFG_ADDRESS:-n/a}"
            echo "Peer PublicKey: ${CFG_PEER_PUBLIC_KEY:-n/a}"
            echo "Endpoint: ${CFG_ENDPOINT:-n/a}"
            echo "AllowedIPs: ${CFG_ALLOWED_IPS:-n/a}"
            echo "PersistentKeepalive: ${CFG_KEEPALIVE:-n/a}"
          else
            CONFIG_VALID="false"
            ROOT_CAUSE_DETAILS="WireGuard-Konfigurationsdatei fehlt."
            echo "::warning::WireGuard-Konfigurationsdatei ${WG_CONFIG_PATH} nicht gefunden."
          fi
          echo

          WIREGUARD_ENDPOINT_HOST=""
          WIREGUARD_ENDPOINT_PORT=""
          if [ -n "${CFG_ENDPOINT:-}" ]; then
            if echo "${CFG_ENDPOINT}" | grep -Eq '^\[[^]]+\]:[0-9]+$'; then
              WIREGUARD_ENDPOINT_HOST="$(echo "${CFG_ENDPOINT}" | sed -E 's/^\[([^]]+)\]:([0-9]+)$/\1/')"
              WIREGUARD_ENDPOINT_PORT="$(echo "${CFG_ENDPOINT}" | sed -E 's/^\[([^]]+)\]:([0-9]+)$/\2/')"
            elif echo "${CFG_ENDPOINT}" | grep -Eq '^[^:]+:[0-9]+$'; then
              WIREGUARD_ENDPOINT_HOST="${CFG_ENDPOINT%:*}"
              WIREGUARD_ENDPOINT_PORT="${CFG_ENDPOINT##*:}"
            else
              CONFIG_VALID="false"
              ROOT_CAUSE_DETAILS="WireGuard-Endpoint hat ein ungueltiges Format."
              echo "::warning::Endpoint-Format ungueltig: ${CFG_ENDPOINT}"
            fi
          fi
          echo "=== wg show ${WG_INTERFACE} (nur angeforderte Felder) ==="
          WG_SHOW_PEER="$(sudo wg show "${WG_INTERFACE}" peers 2>/dev/null | head -n 1)"
          WG_SHOW_ENDPOINT="$(sudo wg show "${WG_INTERFACE}" endpoints 2>/dev/null | awk -v peer="${WG_SHOW_PEER}" '$1 == peer {print $2}')"
          WG_SHOW_ALLOWED_IPS="$(sudo wg show "${WG_INTERFACE}" allowed-ips 2>/dev/null | awk -v peer="${WG_SHOW_PEER}" '$1 == peer {print $2}')"
          WG_SHOW_HANDSHAKE_TS="$(sudo wg show "${WG_INTERFACE}" latest-handshakes 2>/dev/null | awk -v peer="${WG_SHOW_PEER}" '$1 == peer {print $2}')"
          WG_SHOW_TRANSFER="$(sudo wg show "${WG_INTERFACE}" transfer 2>/dev/null | awk -v peer="${WG_SHOW_PEER}" '$1 == peer {print $2 " / " $3}')"

          echo "Interface: ${WG_INTERFACE}"
          echo "Peer PublicKey: ${WG_SHOW_PEER:-n/a}"
          echo "Endpoint: ${WG_SHOW_ENDPOINT:-n/a}"
          echo "AllowedIPs: ${WG_SHOW_ALLOWED_IPS:-n/a}"
          echo "latest handshake: ${WG_SHOW_HANDSHAKE_TS:-n/a}"
          echo "transfer rx/tx: ${WG_SHOW_TRANSFER:-n/a}"
          echo

          echo "=== DNS-Aufloesung des WireGuard-Endpoints ==="
          if [ -n "${WIREGUARD_ENDPOINT_HOST}" ]; then
            getent hosts "${WIREGUARD_ENDPOINT_HOST}"
            DNS_RC=$?
            if [ "${DNS_RC}" -ne 0 ]; then
              DNS_OK="false"
              ROOT_CAUSE_CODE="A"
              ROOT_CAUSE_DETAILS="Endpoint-Hostname konnte nicht aufgeloest werden."
              echo "::warning::DNS-Aufloesung fehlgeschlagen fuer ${WIREGUARD_ENDPOINT_HOST}."
            fi
          else
            DNS_OK="false"
            ROOT_CAUSE_CODE="A"
            ROOT_CAUSE_DETAILS="Endpoint-Hostname fehlt oder konnte nicht aus Endpoint geparst werden."
            echo "::warning::WIREGUARD_ENDPOINT_HOST ist leer."
          fi
          echo

          echo "=== UDP-Port-Pruefung des WireGuard-Endpoints ==="
          if [ -z "${WIREGUARD_ENDPOINT_PORT}" ] || ! echo "${WIREGUARD_ENDPOINT_PORT}" | grep -Eq '^[0-9]+$'; then
            PORT_OK="false"
            ROOT_CAUSE_CODE="D"
            ROOT_CAUSE_DETAILS="WireGuard-Endpoint-Port fehlt oder ist ungueltig."
            echo "::warning::WireGuard-Endpoint-Port fehlt oder ist ungueltig: ${WIREGUARD_ENDPOINT_PORT:-leer}."
          elif [ "${WIREGUARD_ENDPOINT_PORT}" -lt 1 ] || [ "${WIREGUARD_ENDPOINT_PORT}" -gt 65535 ]; then
            PORT_OK="false"
            ROOT_CAUSE_CODE="D"
            ROOT_CAUSE_DETAILS="WireGuard-Endpoint-Port liegt ausserhalb 1-65535."
            echo "::warning::WireGuard-Endpoint-Port liegt ausserhalb 1-65535: ${WIREGUARD_ENDPOINT_PORT}."
          elif [ "${DNS_OK}" = "true" ]; then
            ENDPOINT_IP="$(getent hosts "${WIREGUARD_ENDPOINT_HOST}" | awk 'NR==1{print $1}')"
            echo "Endpoint Host: ${WIREGUARD_ENDPOINT_HOST}"
            echo "Endpoint Port: ${WIREGUARD_ENDPOINT_PORT}"
            echo "Aufgeloeste Endpoint-IP (erste): ${ENDPOINT_IP:-n/a}"
            if [ -n "${ENDPOINT_IP}" ]; then
              ip route get "${ENDPOINT_IP}" 2>/dev/null || true
            fi
            printf "wg-ci-udp-probe" | nc -u -w 3 "${WIREGUARD_ENDPOINT_HOST}" "${WIREGUARD_ENDPOINT_PORT}" >/dev/null 2>&1
            UDP_PROBE_RC=$?
            if [ "${UDP_PROBE_RC}" -eq 0 ]; then
              echo "UDP-Probe: Paket an Endpoint gesendet (UDP ist verbindungslos, kein Ack erwartet)."
            else
              echo "::warning::UDP-Probe konnte nicht gesendet werden (Exit-Code: ${UDP_PROBE_RC})."
            fi
          else
            echo "UDP-Pruefung uebersprungen, da DNS nicht erfolgreich war."
          fi
          echo

          echo "=== Peer/PublicKey/PrivateKey Plausibilitaet ==="
          if [ -n "${CFG_PEER_PUBLIC_KEY:-}" ] && ! echo "${CFG_PEER_PUBLIC_KEY}" | grep -Eq '^[A-Za-z0-9+/]{43}=$'; then
            PEER_OK="false"
            ROOT_CAUSE_CODE="B"
            ROOT_CAUSE_DETAILS="Peer PublicKey hat kein gueltiges WireGuard-Format."
            echo "::warning::Peer PublicKey hat kein gueltiges Format."
          fi

          DERIVED_CLIENT_PUBLIC_KEY="$(printf '%s' "${WG_PRIVATE_KEY}" | wg pubkey 2>/dev/null)"
          unset WG_PRIVATE_KEY
          if [ -z "${DERIVED_CLIENT_PUBLIC_KEY}" ]; then
            CLIENT_KEY_OK="false"
            ROOT_CAUSE_CODE="C"
            ROOT_CAUSE_DETAILS="WIREGUARD_PRIVATE_KEY konnte nicht in einen PublicKey umgewandelt werden."
            echo "::warning::WIREGUARD_PRIVATE_KEY ist ungueltig oder nicht mit wg pubkey auswertbar."
          else
            DERIVED_CLIENT_PUBLIC_KEY_FINGERPRINT="$(printf '%s' "${DERIVED_CLIENT_PUBLIC_KEY}" | sha256sum | awk '{print $1}' | cut -c1-12)"
            echo "Derived GitHub client PublicKey fingerprint (sha256, 12 chars): ${DERIVED_CLIENT_PUBLIC_KEY_FINGERPRINT}"
          fi

          if [ -n "${DERIVED_CLIENT_PUBLIC_KEY}" ] && [ -n "${WG_EXPECTED_CLIENT_PUBLIC_KEY}" ] && [ "${DERIVED_CLIENT_PUBLIC_KEY}" != "${WG_EXPECTED_CLIENT_PUBLIC_KEY}" ]; then
            CLIENT_KEY_OK="false"
            ROOT_CAUSE_CODE="C"
            ROOT_CAUSE_DETAILS="WIREGUARD_PRIVATE_KEY passt nicht zum erwarteten GitHub-Client-PublicKey."
            echo "::warning::Derived Client PublicKey entspricht nicht WIREGUARD_CLIENT_PUBLIC_KEY."
          fi

          if [ -n "${DERIVED_CLIENT_PUBLIC_KEY}" ] && [ -n "${CFG_PEER_PUBLIC_KEY:-}" ] && [ "${DERIVED_CLIENT_PUBLIC_KEY}" = "${CFG_PEER_PUBLIC_KEY}" ]; then
            PEER_OK="false"
            ROOT_CAUSE_CODE="B"
            ROOT_CAUSE_DETAILS="Peer PublicKey ist identisch zum GitHub-Client-PublicKey."
            echo "::warning::Peer PublicKey entspricht dem GitHub-Client-PublicKey (falscher Peer)."
          fi

          if [ -n "${WG_EXPECTED_SPEEDPORT_PUBLIC_KEY}" ] && [ -n "${CFG_PEER_PUBLIC_KEY:-}" ] && [ "${CFG_PEER_PUBLIC_KEY}" != "${WG_EXPECTED_SPEEDPORT_PUBLIC_KEY}" ]; then
            PEER_OK="false"
            ROOT_CAUSE_CODE="B"
            ROOT_CAUSE_DETAILS="Peer PublicKey stimmt nicht mit dem erwarteten Speedport PublicKey ueberein."
            echo "::warning::Peer PublicKey stimmt nicht mit WIREGUARD_SPEEDPORT_PUBLIC_KEY ueberein."
          fi

          if [ -n "${WG_IPHONE_PUBLIC_KEY}" ] && [ -n "${CFG_PEER_PUBLIC_KEY:-}" ] && [ "${CFG_PEER_PUBLIC_KEY}" = "${WG_IPHONE_PUBLIC_KEY}" ]; then
            PEER_OK="false"
            ROOT_CAUSE_CODE="B"
            ROOT_CAUSE_DETAILS="Peer PublicKey ist der iPhone PublicKey statt des Speedport PublicKey."
            echo "::warning::Peer PublicKey entspricht WIREGUARD_IPHONE_PUBLIC_KEY (falscher Peer)."
          fi

          if [ -n "${WG_IPHONE_ENDPOINT}" ]; then
            if [ "${CFG_ENDPOINT:-}" = "${WG_IPHONE_ENDPOINT}" ]; then
              echo "Endpoint-Abgleich mit iPhone-Konfiguration: IDENTISCH"
            else
              if [ "${ROOT_CAUSE_CODE}" = "F" ]; then
                ROOT_CAUSE_CODE="A"
                ROOT_CAUSE_DETAILS="Endpoint weicht von WIREGUARD_IPHONE_ENDPOINT ab."
              fi
              echo "::warning::Endpoint-Abgleich mit iPhone-Konfiguration: ABWEICHEND"
              echo "::warning::CI Endpoint: ${CFG_ENDPOINT:-n/a}"
              echo "::warning::iPhone Endpoint: ${WG_IPHONE_ENDPOINT}"
            fi
          else
            echo "Endpoint-Abgleich mit iPhone-Konfiguration: nicht moeglich (WIREGUARD_IPHONE_ENDPOINT nicht gesetzt)."
          fi
          echo

          echo "=== Interface check ==="
          if ip link show "${WG_INTERFACE}" >/dev/null 2>&1; then
            echo "WireGuard Interface vorhanden: JA"
            ip link show "${WG_INTERFACE}"
            echo
            echo "=== MTU ==="
            ip link show "${WG_INTERFACE}" | grep -o 'mtu [0-9]*' || true
          else
            echo "WireGuard Interface vorhanden: NEIN"
          fi
          echo
          echo "=== Handshake-Status ==="
          HANDSHAKE_TS="${WG_SHOW_HANDSHAKE_TS:-0}"
          if [ -n "${HANDSHAKE_TS}" ] && [ "${HANDSHAKE_TS}" != "0" ]; then
            echo "Letzter Handshake Unix-Timestamp: ${HANDSHAKE_TS}"
          else
            echo "Kein Handshake vorhanden (Timestamp: ${HANDSHAKE_TS:-n/a})"
          fi
          echo
          echo "=== Routing table (main) ==="
          ip route
          echo
          echo "=== Route to CCU ==="
          ip route get "${CCU_IP}" 2>/dev/null || echo "Keine Route zur CCU3 gefunden"

          if [ "${HANDSHAKE_STATUS:-FEHLER}" != "OK" ] && [ "${ROOT_CAUSE_CODE}" = "F" ]; then
            if [ "${CONFIG_VALID}" != "true" ]; then
              ROOT_CAUSE_DETAILS="WireGuard-Konfiguration ist unvollstaendig oder ungueltig."
            else
              ROOT_CAUSE_CODE="E"
              ROOT_CAUSE_DETAILS="Endpoint/Port/Keys sehen plausibel aus, aber Speedport akzeptiert den Peer nicht (kein Handshake)."
            fi
          fi

          echo "HANDSHAKE_ROOT_CAUSE_CODE=${ROOT_CAUSE_CODE}" >> "$GITHUB_ENV"
          {
            echo "HANDSHAKE_ROOT_CAUSE_DETAILS<<EOF"
            echo "${ROOT_CAUSE_DETAILS}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Diagnosecode: ${ROOT_CAUSE_CODE}"
          echo "Diagnose: ${ROOT_CAUSE_DETAILS}"

      - name: Verify tunnel and test CCU3 reachability
        if: ${{ env.WG_STATUS == 'OK' && env.HANDSHAKE_STATUS == 'OK' }}
        env:
          CCU_XMLAPI_USER: ${{ secrets.CCU_XMLAPI_USER }}
          CCU_XMLAPI_PASSWORD: ${{ secrets.CCU_XMLAPI_PASSWORD }}
          CCU_XMLAPI_SID: ${{ secrets.CCU_XMLAPI_SID }}
        run: |
          set +e

          echo "ROUTE_STATUS=FEHLER" >> "$GITHUB_ENV"
          echo "TCP_STATUS=FEHLER" >> "$GITHUB_ENV"
          echo "HTTP_STATUS=FEHLER" >> "$GITHUB_ENV"
          echo "HMIP_STATUS=FEHLER" >> "$GITHUB_ENV"
          echo "XMLAPI_STATUS=FEHLER" >> "$GITHUB_ENV"
          echo "KEYPAD_STATUS=WARN" >> "$GITHUB_ENV"
          echo "KEYPAD_CODE_UPDATE_STATUS=SKIP" >> "$GITHUB_ENV"
          echo "VPN_STATUS=FEHLER" >> "$GITHUB_ENV"

          if ip link show "${WG_INTERFACE}" >/dev/null 2>&1; then
            echo "WireGuard-Tunnel aktiv: JA"
            echo "VPN_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "WireGuard-Tunnel aktiv: NEIN"
            exit 1
          fi

          if ip route get "${CCU_IP}" >/dev/null 2>&1; then
            echo "Route zur CCU3 vorhanden: JA"
            echo "ROUTE_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "Route zur CCU3 vorhanden: NEIN"
          fi

          echo
          echo "ICMP-Test (informativ, kein harter Fehler):"
          if ping -c 3 -W 5 "${CCU_IP}" 2>/dev/null; then
            echo "Ping zur CCU3 erfolgreich."
          else
            echo "Ping fehlgeschlagen oder geblockt (nicht zwingend ein Fehler im VPN-Setup)."
          fi

          echo
          echo "=== TCP-Test Port 80 ==="
          TCP_80="false"
          TCP_443="false"
          HTTP_OK="false"

          if nc -vz -w 10 "${CCU_IP}" 80 2>&1; then
            echo "TCP Port 80: OFFEN"
            TCP_80="true"
          else
            echo "TCP Port 80: NICHT ERREICHBAR"
          fi

          echo
          echo "=== TCP-Test Port 443 ==="
          if nc -vz -w 10 "${CCU_IP}" 443 2>&1; then
            echo "TCP Port 443: OFFEN"
            TCP_443="true"
          else
            echo "TCP Port 443: NICHT ERREICHBAR"
          fi

          if [ "${TCP_80}" = "true" ] || [ "${TCP_443}" = "true" ]; then
            echo "TCP_STATUS=OK" >> "$GITHUB_ENV"
          fi

          if [ "${TCP_80}" = "true" ]; then
            echo
            echo "=== HTTP-Test Port 80 ==="
            HTTP_CODE_80="$(curl --connect-timeout 10 --max-time 15 -sS -o /dev/null -w "%{http_code}" "http://${CCU_IP}/" 2>/dev/null || true)"
            echo "HTTP-Statuscode (80): ${HTTP_CODE_80:-keine Antwort}"
            if [ -n "${HTTP_CODE_80}" ] && [ "${HTTP_CODE_80}" != "000" ]; then
              HTTP_OK="true"
            fi
          fi

          if [ "${TCP_443}" = "true" ]; then
            echo
            echo "=== HTTP-Test Port 443 ==="
            HTTP_CODE_443="$(curl -k --connect-timeout 10 --max-time 15 -sS -o /dev/null -w "%{http_code}" "https://${CCU_IP}/" 2>/dev/null || true)"
            echo "HTTP-Statuscode (443): ${HTTP_CODE_443:-keine Antwort}"
            if [ -n "${HTTP_CODE_443}" ] && [ "${HTTP_CODE_443}" != "000" ]; then
              HTTP_OK="true"
            fi
          fi

          if [ "${HTTP_OK}" = "true" ]; then
            echo "HTTP_STATUS=OK" >> "$GITHUB_ENV"
          fi

          echo
          echo "=== Homematic IP TCP-Test Port ${CCU_HMIP_PORT} ==="
          if nc -vz -w 10 "${CCU_IP}" "${CCU_HMIP_PORT}" 2>&1; then
            echo "Homematic IP Port ${CCU_HMIP_PORT}: OFFEN"
            echo "HMIP_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "Homematic IP Port ${CCU_HMIP_PORT}: NICHT ERREICHBAR"
            echo "::warning::HmIP-Port ${CCU_HMIP_PORT} nicht erreichbar. XML-API kann trotzdem funktionieren."
          fi

          echo
          echo "=== CCU XML-API Test (${CCU_XMLAPI_PATH}) ==="

          append_query_param() {
            local url="$1"
            local key="$2"
            local value="$3"
            if [ -z "${value}" ]; then
              printf '%s' "${url}"
            elif echo "${url}" | grep -q '?'; then
              printf '%s&%s=%s' "${url}" "${key}" "${value}"
            else
              printf '%s?%s=%s' "${url}" "${key}" "${value}"
            fi
          }

          XMLAPI_URL_BASE="http://${CCU_IP}${CCU_XMLAPI_PATH}"
          DEVICELIST_URL_BASE="http://${CCU_IP}/addons/xmlapi/devicelist.cgi"
          STATELIST_URL_BASE="http://${CCU_IP}/addons/xmlapi/statelist.cgi"

          XMLAPI_URL="${XMLAPI_URL_BASE}"
          DEVICELIST_URL="${DEVICELIST_URL_BASE}"
          STATELIST_URL="${STATELIST_URL_BASE}"
          XMLAPI_AUTH_ARGS=()
          CCU_XMLAPI_SID_CLEAN="$(printf '%s' "${CCU_XMLAPI_SID:-}" | tr -d '\r\n[:space:]')"
          if [ -n "${CCU_XMLAPI_SID_CLEAN}" ]; then
            if [ "${CCU_XMLAPI_SID_CLEAN}" != "${CCU_XMLAPI_SID:-}" ]; then
              echo "::warning::CCU_XMLAPI_SID enthielt Whitespace/Zeilenumbrueche und wurde bereinigt."
            fi
            XMLAPI_URL="$(append_query_param "${XMLAPI_URL_BASE}" "sid" "${CCU_XMLAPI_SID_CLEAN}")"
            DEVICELIST_URL="$(append_query_param "${DEVICELIST_URL_BASE}" "sid" "${CCU_XMLAPI_SID_CLEAN}")"
            STATELIST_URL="$(append_query_param "${STATELIST_URL_BASE}" "sid" "${CCU_XMLAPI_SID_CLEAN}")"
            echo "XML-API Auth-Modus: SID-Token"
          elif [ -n "${CCU_XMLAPI_USER}" ] && [ -n "${CCU_XMLAPI_PASSWORD}" ]; then
            XMLAPI_AUTH_ARGS=(-u "${CCU_XMLAPI_USER}:${CCU_XMLAPI_PASSWORD}")
            echo "XML-API Auth-Modus: Basic Auth"
          else
            echo "::warning::Kein XML-API Token (CCU_XMLAPI_SID) und keine Basic-Auth-Credentials gesetzt."
          fi

          XMLAPI_BODY_FILE="/tmp/ccu-xmlapi-response.xml"
          XMLAPI_ERR_FILE="/tmp/ccu-xmlapi-error.log"
          XMLAPI_FALLBACK_BODY_FILE="/tmp/ccu-xmlapi-version-response.xml"
          XMLAPI_FALLBACK_ERR_FILE="/tmp/ccu-xmlapi-version-error.log"
          : > "${XMLAPI_BODY_FILE}"
          XMLAPI_HTTP_CODE="$(curl --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 1 --retry-connrefused -sS "${XMLAPI_AUTH_ARGS[@]}" -o "${XMLAPI_BODY_FILE}" -w "%{http_code}" "${XMLAPI_URL}" 2>"${XMLAPI_ERR_FILE}" || true)"
          echo "XML-API HTTP-Status: ${XMLAPI_HTTP_CODE:-keine Antwort}"
          if [ "${XMLAPI_HTTP_CODE}" = "000" ]; then
            echo "::warning::curl konnte ${CCU_XMLAPI_PATH} nicht abrufen (HTTP 000)."
            tail -n 3 "${XMLAPI_ERR_FILE}" 2>/dev/null || true
          fi

          if [ "${XMLAPI_HTTP_CODE}" = "200" ] \
            && grep -qiE '<[[:space:]]*(stateList|systemVariables|xml)' "${XMLAPI_BODY_FILE}" \
            && ! grep -qiE '<[[:space:]]*not_authenticated[[:space:]]*/>' "${XMLAPI_BODY_FILE}"; then
            echo "XML-API Antwort gueltig: JA"
            echo "XMLAPI_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "XML-API Antwort gueltig: NEIN"
            if grep -qiE '<[[:space:]]*not_authenticated[[:space:]]*/>' "${XMLAPI_BODY_FILE}"; then
              echo "::warning::XML-API meldet not_authenticated. Bitte CCU_XMLAPI_USER/CCU_XMLAPI_PASSWORD und Benutzerrechte auf der CCU pruefen."
            fi
            echo "::warning::XML-API nicht erreichbar oder unerwartete Antwort. URL: ${XMLAPI_URL}"

            # Fallback: leichter Healthcheck gegen version.cgi, damit ein einzelner statelist-Timeout
            # nicht den gesamten XML-API-Status faelschlich auf FEHLER setzt.
            XMLAPI_FALLBACK_URL_BASE="http://${CCU_IP}/addons/xmlapi/version.cgi"
            XMLAPI_FALLBACK_URL="${XMLAPI_FALLBACK_URL_BASE}"
            if [ -n "${CCU_XMLAPI_SID_CLEAN:-}" ]; then
              XMLAPI_FALLBACK_URL="$(append_query_param "${XMLAPI_FALLBACK_URL_BASE}" "sid" "${CCU_XMLAPI_SID_CLEAN}")"
            fi
            : > "${XMLAPI_FALLBACK_BODY_FILE}"
            XMLAPI_FALLBACK_HTTP_CODE="$(curl --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 1 --retry-connrefused -sS "${XMLAPI_AUTH_ARGS[@]}" -o "${XMLAPI_FALLBACK_BODY_FILE}" -w "%{http_code}" "${XMLAPI_FALLBACK_URL}" 2>"${XMLAPI_FALLBACK_ERR_FILE}" || true)"
            echo "XML-API Fallback version.cgi HTTP-Status: ${XMLAPI_FALLBACK_HTTP_CODE:-keine Antwort}"
            if [ "${XMLAPI_FALLBACK_HTTP_CODE}" = "200" ] \
              && ! grep -qiE '<[[:space:]]*not_authenticated[[:space:]]*/>' "${XMLAPI_FALLBACK_BODY_FILE}" \
              && grep -qiE '<[[:space:]]*version' "${XMLAPI_FALLBACK_BODY_FILE}"; then
              echo "::warning::Primarer XML-API-Check fehlgeschlagen, aber version.cgi ist erreichbar. XML-API wird als erreichbar gewertet."
              echo "XMLAPI_STATUS=OK" >> "$GITHUB_ENV"
            elif [ "${XMLAPI_FALLBACK_HTTP_CODE}" = "000" ]; then
              echo "::warning::curl konnte version.cgi ebenfalls nicht abrufen (HTTP 000)."
              tail -n 3 "${XMLAPI_FALLBACK_ERR_FILE}" 2>/dev/null || true
            fi
          fi
          rm -f "${XMLAPI_BODY_FILE}" "${XMLAPI_ERR_FILE}" "${XMLAPI_FALLBACK_BODY_FILE}" "${XMLAPI_FALLBACK_ERR_FILE}"

          echo
          echo "=== Keypad-Auswertung ueber XML-API ==="
          DEVICELIST_FILE_RAW="/tmp/ccu-devicelist.xml"
          STATELIST_FILE_RAW="/tmp/ccu-statelist.xml"
          DEVICELIST_FILE="/tmp/ccu-devicelist.pretty.xml"
          STATELIST_FILE="/tmp/ccu-statelist.pretty.xml"
          DEVICELIST_ERR_FILE="/tmp/ccu-devicelist-error.log"
          STATELIST_ERR_FILE="/tmp/ccu-statelist-error.log"

          : > "${DEVICELIST_FILE_RAW}"
          : > "${STATELIST_FILE_RAW}"

          DEVICELIST_HTTP_CODE="$(curl --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 1 --retry-connrefused -sS "${XMLAPI_AUTH_ARGS[@]}" -o "${DEVICELIST_FILE_RAW}" -w "%{http_code}" "${DEVICELIST_URL}" 2>"${DEVICELIST_ERR_FILE}" || true)"
          STATELIST_HTTP_CODE="$(curl --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 1 --retry-connrefused -sS "${XMLAPI_AUTH_ARGS[@]}" -o "${STATELIST_FILE_RAW}" -w "%{http_code}" "${STATELIST_URL}" 2>"${STATELIST_ERR_FILE}" || true)"

          echo "devicelist.cgi HTTP-Status: ${DEVICELIST_HTTP_CODE:-keine Antwort}"
          echo "statelist.cgi HTTP-Status: ${STATELIST_HTTP_CODE:-keine Antwort}"
          if [ "${DEVICELIST_HTTP_CODE}" = "000" ]; then
            echo "::warning::curl konnte devicelist.cgi nicht abrufen (HTTP 000)."
            tail -n 3 "${DEVICELIST_ERR_FILE}" 2>/dev/null || true
          fi
          if [ "${STATELIST_HTTP_CODE}" = "000" ]; then
            echo "::warning::curl konnte statelist.cgi nicht abrufen (HTTP 000)."
            tail -n 3 "${STATELIST_ERR_FILE}" 2>/dev/null || true
          fi

          DEVICELIST_BYTES="$(wc -c < "${DEVICELIST_FILE_RAW}" 2>/dev/null || echo 0)"
          STATELIST_BYTES="$(wc -c < "${STATELIST_FILE_RAW}" 2>/dev/null || echo 0)"
          echo "devicelist.cgi Groesse: ${DEVICELIST_BYTES} Bytes"
          echo "statelist.cgi Groesse: ${STATELIST_BYTES} Bytes"

          if [ "${DEVICELIST_HTTP_CODE}" = "200" ] && [ "${STATELIST_HTTP_CODE}" = "200" ]; then
            sed 's/></>\n</g' "${DEVICELIST_FILE_RAW}" > "${DEVICELIST_FILE}"
            sed 's/></>\n</g' "${STATELIST_FILE_RAW}" > "${STATELIST_FILE}"
            # Einige CCU-Antworten enthalten ungueltige Bytefolgen.
            # iconv -c entfernt diese, damit awk/grep stabil parsen.
            if command -v iconv >/dev/null 2>&1; then
              iconv -f UTF-8 -t UTF-8 -c "${DEVICELIST_FILE}" > "${DEVICELIST_FILE}.clean" 2>/dev/null || cp "${DEVICELIST_FILE}" "${DEVICELIST_FILE}.clean"
              iconv -f UTF-8 -t UTF-8 -c "${STATELIST_FILE}" > "${STATELIST_FILE}.clean" 2>/dev/null || cp "${STATELIST_FILE}" "${STATELIST_FILE}.clean"
              mv "${DEVICELIST_FILE}.clean" "${DEVICELIST_FILE}"
              mv "${STATELIST_FILE}.clean" "${STATELIST_FILE}"
            fi

            KEYPAD_HINT_LINES_DEV="$(grep -aEi '<device |<channel ' "${DEVICELIST_FILE}" | grep -aEi "${CCU_KEYPAD_MATCH_REGEX}" || true)"
            KEYPAD_HINT_LINES_STATE="$(grep -aEi '<device |<channel ' "${STATELIST_FILE}" | grep -aEi "${CCU_KEYPAD_MATCH_REGEX}" || true)"

            if [ -n "${CCU_KEYPAD_SERIAL}" ]; then
              SERIAL_HINT_LINES_DEV="$(grep -aEi '<device |<channel ' "${DEVICELIST_FILE}" | grep -aEi "address=['\"]${CCU_KEYPAD_SERIAL}(:[0-9]+)?['\"]|serial=['\"]${CCU_KEYPAD_SERIAL}['\"]" || true)"
              SERIAL_HINT_LINES_STATE="$(grep -aEi '<device |<channel ' "${STATELIST_FILE}" | grep -aEi "address=['\"]${CCU_KEYPAD_SERIAL}(:[0-9]+)?['\"]|serial=['\"]${CCU_KEYPAD_SERIAL}['\"]" || true)"
              KEYPAD_HINT_LINES_DEV="$(printf '%s\n%s\n' "${KEYPAD_HINT_LINES_DEV}" "${SERIAL_HINT_LINES_DEV}" | sed '/^$/d' || true)"
              KEYPAD_HINT_LINES_STATE="$(printf '%s\n%s\n' "${KEYPAD_HINT_LINES_STATE}" "${SERIAL_HINT_LINES_STATE}" | sed '/^$/d' || true)"
            fi

            KEYPAD_ADDRESSES="$(
              printf '%s\n%s\n' "${KEYPAD_HINT_LINES_DEV}" "${KEYPAD_HINT_LINES_STATE}" \
              | sed -n "s/.* address=['\"]\([^'\"]*\)['\"].*/\1/p" \
              | sed -E 's/:[0-9]+$//' \
              | sed '/^$/d' \
              | sort -u
            )"
            if [ -n "${CCU_KEYPAD_SERIAL}" ]; then
              SERIAL_MATCH_LINES="$(printf '%s\n%s\n' "${SERIAL_HINT_LINES_DEV:-}" "${SERIAL_HINT_LINES_STATE:-}" | sed '/^$/d' || true)"
              if [ -n "${SERIAL_MATCH_LINES}" ]; then
                KEYPAD_ADDRESSES="$(printf '%s\n%s\n' "${KEYPAD_ADDRESSES}" "${CCU_KEYPAD_SERIAL}" | sed '/^$/d' | sort -u)"
              fi
            fi

            if [ -z "${KEYPAD_ADDRESSES}" ]; then
              echo "::warning::Keine Keypad-Geraete gefunden. Regex: ${CCU_KEYPAD_MATCH_REGEX}"
              if [ -n "${CCU_KEYPAD_SERIAL}" ]; then
                echo "::warning::Fallback-Serial wurde verwendet, aber ebenfalls kein Treffer: ${CCU_KEYPAD_SERIAL}"
              fi
              DEV_DEVICE_COUNT="$(grep -aEc '<device ' "${DEVICELIST_FILE}" || true)"
              STATE_DEVICE_COUNT="$(grep -aEc '<device ' "${STATELIST_FILE}" || true)"
              DEV_CHANNEL_COUNT="$(grep -aEc '<channel ' "${DEVICELIST_FILE}" || true)"
              STATE_CHANNEL_COUNT="$(grep -aEc '<channel ' "${STATELIST_FILE}" || true)"
              echo "--- Diagnose: XML-Zaehler ---"
              echo "devicelist: devices=${DEV_DEVICE_COUNT} channels=${DEV_CHANNEL_COUNT}"
              echo "statelist:  devices=${STATE_DEVICE_COUNT} channels=${STATE_CHANNEL_COUNT}"

              if [ "${DEV_DEVICE_COUNT}" = "0" ] && [ "${STATE_DEVICE_COUNT}" = "0" ]; then
                echo "::warning::XML-API liefert keine <device>-Eintraege. Moegliche Ursache: fehlende WebUI-Rechte des XML-API-Users oder unerwartete Antwortstruktur."
                if grep -aqiE '<html|<form|login|anmeldung|auth' "${DEVICELIST_FILE_RAW}" || grep -aqiE '<html|<form|login|anmeldung|auth' "${STATELIST_FILE_RAW}"; then
                  echo "::warning::Antwort wirkt wie HTML/Login-Seite statt XML-Device-Liste. Bitte CCU_XMLAPI_USER/CCU_XMLAPI_PASSWORD und Benutzerrechte pruefen."
                fi
                echo "--- Diagnose: Rohauszug devicelist.cgi (erste 25 Zeilen) ---"
                sed 's/></>\n</g' "${DEVICELIST_FILE_RAW}" | head -n 25 || true
                echo "--- Diagnose: Rohauszug statelist.cgi (erste 25 Zeilen) ---"
                sed 's/></>\n</g' "${STATELIST_FILE_RAW}" | head -n 25 || true
              fi

              echo "--- Diagnose: Volltextsuche in devicelist (HmIP|WKP|KEYPAD|TAST|Serial, max. 80) ---"
              if [ -n "${CCU_KEYPAD_SERIAL}" ]; then
                grep -aEin "HmIP|WKP|KEYPAD|TAST|${CCU_KEYPAD_SERIAL}" "${DEVICELIST_FILE}" | head -n 80 || true
              else
                grep -aEin "HmIP|WKP|KEYPAD|TAST" "${DEVICELIST_FILE}" | head -n 80 || true
              fi

              echo "--- Diagnose: Volltextsuche in statelist (HmIP|WKP|KEYPAD|TAST|Serial, max. 80) ---"
              if [ -n "${CCU_KEYPAD_SERIAL}" ]; then
                grep -aEin "HmIP|WKP|KEYPAD|TAST|${CCU_KEYPAD_SERIAL}" "${STATELIST_FILE}" | head -n 80 || true
              else
                grep -aEin "HmIP|WKP|KEYPAD|TAST" "${STATELIST_FILE}" | head -n 80 || true
              fi

              echo "--- Diagnose: Erste 30 device-Zeilen aus devicelist ---"
              grep -aEi '<device ' "${DEVICELIST_FILE}" | head -n 30 || true
              echo "--- Diagnose: Erste 30 device-Zeilen aus statelist ---"
              grep -aEi '<device ' "${STATELIST_FILE}" | head -n 30 || true
              CCU_REQUIRE_KEYPAD_MATCH_NORMALIZED="$(printf '%s' "${CCU_REQUIRE_KEYPAD_MATCH}" | tr '[:upper:]' '[:lower:]')"
              if [ "${CCU_REQUIRE_KEYPAD_MATCH_NORMALIZED}" = "true" ]; then
                echo "KEYPAD_STATUS=FEHLER" >> "$GITHUB_ENV"
              fi
            else
              echo "Gefundene Keypad-Basisadressen:"
              printf '%s\n' "${KEYPAD_ADDRESSES}" | sed 's/^/  /'

              CCU_KEYPAD_APPLY_CODE_NORMALIZED="$(printf '%s' "${CCU_KEYPAD_APPLY_CODE}" | tr '[:upper:]' '[:lower:]')"
              if [ "${CCU_KEYPAD_APPLY_CODE_NORMALIZED}" = "true" ]; then
                echo
                echo "--- Keypad-Code-Update (Kanal ${CCU_KEYPAD_UPDATE_CHANNEL}) ---"
                UPDATE_OK_COUNT=0
                UPDATE_FAIL_COUNT=0

                while IFS= read -r KEYPAD_ADDR; do
                  [ -z "${KEYPAD_ADDR}" ] && continue
                  TARGET_CHANNEL_ADDR="${KEYPAD_ADDR}:${CCU_KEYPAD_UPDATE_CHANNEL}"
                  CHANNEL_BLOCK="$(LC_ALL=C awk -v addr="${TARGET_CHANNEL_ADDR}" '
                    $0 ~ "<channel " && (index($0, "address=\"" addr "\"") || index($0, "address='" addr "'")) {in_ch=1}
                    in_ch {print}
                    in_ch && $0 ~ "</channel>" {in_ch=0}
                  ' "${STATELIST_FILE}")"

                  if [ -z "${CHANNEL_BLOCK}" ]; then
                    echo "::warning::Kanal ${TARGET_CHANNEL_ADDR} nicht in statelist gefunden."
                    AVAILABLE_CHANNELS="$(LC_ALL=C grep -aEi '<channel ' "${STATELIST_FILE}" | sed -n "s/.*address=['\"]\(${KEYPAD_ADDR}:[0-9][0-9]*\)['\"].*/\1/p" | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
                    echo "::warning::Verfuegbare Kanaele fuer ${KEYPAD_ADDR}: ${AVAILABLE_CHANNELS:-keine erkannt}"
                    UPDATE_FAIL_COUNT=$((UPDATE_FAIL_COUNT + 1))
                    continue
                  fi

                  TARGET_DP_LINE="$(printf '%s\n' "${CHANNEL_BLOCK}" \
                    | grep -aEi '<datapoint ' \
                    | grep -aEi "type=['\"](ACCESSCODE|ACCESS_CODE|PIN|KEYCODE|CODE)['\"]" \
                    | head -n 1 || true)"
                  if [ -z "${TARGET_DP_LINE}" ]; then
                    TARGET_DP_LINE="$(printf '%s\n' "${CHANNEL_BLOCK}" \
                      | grep -aEi '<datapoint ' \
                      | grep -aEi "type=['\"][^'\"]*(ACCESS|PIN|CODE)[^'\"]*['\"]" \
                      | head -n 1 || true)"
                  fi

                  TARGET_DP_ID="$(printf '%s' "${TARGET_DP_LINE}" | sed -n "s/.* id=['\"]\([0-9][0-9]*\)['\"].*/\1/p")"
                  TARGET_DP_TYPE="$(printf '%s' "${TARGET_DP_LINE}" | sed -n "s/.* type=['\"]\([^'\"]*\)['\"].*/\1/p")"

                  if [ -z "${TARGET_DP_ID}" ]; then
                    echo "::warning::Kein geeignetes Code-Datapoint im Kanal ${TARGET_CHANNEL_ADDR} gefunden."
                    UPDATE_FAIL_COUNT=$((UPDATE_FAIL_COUNT + 1))
                    continue
                  fi

                  UPDATE_URL_BASE="http://${CCU_IP}/addons/xmlapi/statechange.cgi"
                  UPDATE_RESP_FILE="/tmp/ccu-keypad-update-${TARGET_DP_ID}.xml"
                  UPDATE_ERR_FILE="/tmp/ccu-keypad-update-${TARGET_DP_ID}.log"
                  UPDATE_HTTP_CODE="$(curl --connect-timeout 10 --max-time 30 --retry 1 --retry-delay 1 --retry-connrefused -sS "${XMLAPI_AUTH_ARGS[@]}" --get --data-urlencode "ise_id=${TARGET_DP_ID}" --data-urlencode "new_value=${CCU_KEYPAD_NEW_CODE}" -o "${UPDATE_RESP_FILE}" -w "%{http_code}" "${UPDATE_URL_BASE}" 2>"${UPDATE_ERR_FILE}" || true)"

                  if [ "${UPDATE_HTTP_CODE}" = "200" ]; then
                    echo "Code-Update erfolgreich fuer ${TARGET_CHANNEL_ADDR} (Datapoint: ${TARGET_DP_TYPE:-unbekannt}, ID: ${TARGET_DP_ID})."
                    UPDATE_OK_COUNT=$((UPDATE_OK_COUNT + 1))
                  else
                    echo "::warning::Code-Update fehlgeschlagen fuer ${TARGET_CHANNEL_ADDR} (Datapoint-ID ${TARGET_DP_ID}, HTTP ${UPDATE_HTTP_CODE:-000})."
                    tail -n 2 "${UPDATE_ERR_FILE}" 2>/dev/null || true
                    UPDATE_FAIL_COUNT=$((UPDATE_FAIL_COUNT + 1))
                  fi
                  rm -f "${UPDATE_RESP_FILE}" "${UPDATE_ERR_FILE}"
                done <<< "${KEYPAD_ADDRESSES}"

                if [ "${UPDATE_FAIL_COUNT}" -eq 0 ] && [ "${UPDATE_OK_COUNT}" -gt 0 ]; then
                  echo "KEYPAD_CODE_UPDATE_STATUS=OK" >> "$GITHUB_ENV"
                else
                  echo "KEYPAD_CODE_UPDATE_STATUS=FEHLER" >> "$GITHUB_ENV"
                fi
              fi

              while IFS= read -r KEYPAD_ADDR; do
                [ -z "${KEYPAD_ADDR}" ] && continue

                echo
                echo "--- Keypad-Einstellungen (devicelist, Basisadresse: ${KEYPAD_ADDR}) ---"
                LC_ALL=C awk -v addr="${KEYPAD_ADDR}" '
                  $0 ~ "<device " && (index($0, "address=\"" addr "\"") || index($0, "address='" addr "'")) {in_dev=1}
                  in_dev {print}
                  in_dev && $0 ~ "</device>" {in_dev=0}
                ' "${DEVICELIST_FILE}" || true

                echo
                echo "--- Keypad-Status (statelist, Basisadresse: ${KEYPAD_ADDR}) ---"
                LC_ALL=C awk -v addr="${KEYPAD_ADDR}" '
                  $0 ~ "<device " && (index($0, "address=\"" addr "\"") || index($0, "address='" addr "'")) {in_dev=1}
                  in_dev {print}
                  in_dev && $0 ~ "</device>" {in_dev=0}
                ' "${STATELIST_FILE}" | grep -aE '<device |<channel |<datapoint ' || true
              done <<< "${KEYPAD_ADDRESSES}"

              echo "KEYPAD_STATUS=OK" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::Keypad-Auswertung uebersprungen, da devicelist/statelist nicht abrufbar war."
            CCU_REQUIRE_KEYPAD_MATCH_NORMALIZED="$(printf '%s' "${CCU_REQUIRE_KEYPAD_MATCH}" | tr '[:upper:]' '[:lower:]')"
            if [ "${CCU_REQUIRE_KEYPAD_MATCH_NORMALIZED}" = "true" ]; then
              echo "KEYPAD_STATUS=FEHLER" >> "$GITHUB_ENV"
            fi
          fi
          rm -f "${DEVICELIST_FILE_RAW}" "${STATELIST_FILE_RAW}" "${DEVICELIST_FILE}" "${STATELIST_FILE}" "${DEVICELIST_ERR_FILE}" "${STATELIST_ERR_FILE}"

          if [ "${TCP_80}" != "true" ] && [ "${TCP_443}" != "true" ]; then
            echo
            echo "::warning::Kein TCP-Port 80/443 auf der CCU3 erreichbar."
            if [ "${HANDSHAKE_STATUS:-FEHLER}" != "OK" ]; then
              echo "::warning::Handshake fehlt - WireGuard-Tunnel ist nicht aktiv (kein Datenaustausch mit Speedport)."
            fi
          fi

      - name: Final result
        if: ${{ always() }}
        run: |
          set +e
          WG="${WG_STATUS:-FEHLER}"
          VPN="${VPN_STATUS:-FEHLER}"
          ROUTE="${ROUTE_STATUS:-FEHLER}"
          TCP="${TCP_STATUS:-FEHLER}"
          HTTP="${HTTP_STATUS:-FEHLER}"
          HMIP="${HMIP_STATUS:-FEHLER}"
          XMLAPI="${XMLAPI_STATUS:-FEHLER}"
          KEYPAD="${KEYPAD_STATUS:-FEHLER}"
          KEYPAD_CODE_UPDATE="${KEYPAD_CODE_UPDATE_STATUS:-SKIP}"
          HANDSHAKE="${HANDSHAKE_STATUS:-FEHLER}"
          HANDSHAKE_DIAG_CODE="${HANDSHAKE_ROOT_CAUSE_CODE:-F}"
          HANDSHAKE_DIAG_DETAILS="${HANDSHAKE_ROOT_CAUSE_DETAILS:-Keine eindeutige Ursache ermittelt.}"

          echo "============================================"
          echo "Testergebnis:"
          echo "  WireGuard Interface:    ${WG}"
          echo "  VPN-Verbindung:         ${VPN}"
          echo "  WireGuard Handshake:    ${HANDSHAKE}"
          echo "  Route zur CCU3:         ${ROUTE}"
          echo "  TCP-Verbindung CCU3:    ${TCP}"
          echo "  HTTP-Verbindung CCU3:   ${HTTP}"
          echo "  HmIP-Port ${CCU_HMIP_PORT}:     ${HMIP}"
          echo "  XML-API (${CCU_XMLAPI_PATH}):  ${XMLAPI}"
          echo "  Keypad-Daten (XML-API): ${KEYPAD}"
          echo "  Keypad-Code-Update:     ${KEYPAD_CODE_UPDATE}"
          echo "============================================"

          # WireGuard konnte nicht gestartet werden
          if [ "${WG}" != "OK" ]; then
            echo "Ergebnis: WireGuard konnte nicht gestartet werden."
            echo "Bitte Endpoint, Schluessel und WireGuard-Konfiguration pruefen."
            exit 1
          fi

          # Fall A: Alles OK
          if [ "${VPN}" = "OK" ] && [ "${HANDSHAKE}" = "OK" ] && [ "${ROUTE}" = "OK" ] && [ "${TCP}" = "OK" ] && [ "${HTTP}" = "OK" ] && [ "${XMLAPI}" = "OK" ]; then
            if [ "${HMIP}" != "OK" ]; then
              CCU_REQUIRE_HMIP_PORT_NORMALIZED="$(printf '%s' "${CCU_REQUIRE_HMIP_PORT}" | tr '[:upper:]' '[:lower:]')"
              if [ "${CCU_REQUIRE_HMIP_PORT_NORMALIZED}" = "true" ]; then
                echo "Ergebnis: H - HmIP-Port ${CCU_HMIP_PORT} ist erforderlich, aber nicht erreichbar."
                exit 1
              fi
              echo "::warning::HmIP-Port ${CCU_HMIP_PORT} nicht erreichbar, wird aber nicht erzwungen (CCU_REQUIRE_HMIP_PORT=false)."
            fi
            CCU_KEYPAD_APPLY_CODE_NORMALIZED="$(printf '%s' "${CCU_KEYPAD_APPLY_CODE}" | tr '[:upper:]' '[:lower:]')"
            if [ "${CCU_KEYPAD_APPLY_CODE_NORMALIZED}" = "true" ] && [ "${KEYPAD_CODE_UPDATE}" != "OK" ]; then
              echo "Ergebnis: KC - Keypad-Code-Update wurde angefordert, konnte aber nicht erfolgreich abgeschlossen werden."
              echo "Pruefen:"
              echo "  - Secret CCU_KEYPAD_NEW_CODE gesetzt (4-10 Ziffern)"
              echo "  - CCU_KEYPAD_UPDATE_CHANNEL stimmt mit dem Code-Kanal ueberein"
              echo "  - XML-API erlaubt Schreiben auf das gefundene Datapoint"
              exit 1
            fi
            echo "Ergebnis: A - WireGuard funktioniert und CCU3 inkl. XML-API erreichbar. Alles OK."
            exit 0
          fi

          # Fall C: WireGuard-Handshake fehlt
          if [ "${HANDSHAKE}" != "OK" ]; then
            echo "Ergebnis: C - WireGuard-Handshake fehlgeschlagen."
            echo "Diagnosecode: ${HANDSHAKE_DIAG_CODE}"
            echo "Diagnose: ${HANDSHAKE_DIAG_DETAILS}"
            echo "Diagnoseklassen:"
            echo "  A = Endpoint/DNS/Netzwerkproblem"
            echo "  B = falscher Peer PublicKey"
            echo "  C = falscher Client PrivateKey"
            echo "  D = falscher WireGuard-Port"
            echo "  E = Speedport akzeptiert den Peer nicht"
            echo "  F = andere Ursache"
            # Code E: Speedport lehnt den Peer ab. Das ist in einem CI-Lauf erwartet,
            # weil GitHub Actions keinen Zugang zum heimischen Speedport hat.
            # Konfigurationsfehler (A, B, C, D, F) scheitern weiterhin hart.
            if [ "${HANDSHAKE_DIAG_CODE}" = "E" ]; then
              echo "::warning::Kein Handshake (Code E) – Speedport vom GitHub-Runner nicht erreichbar. Konfiguration gilt als gueltig."
              exit 0
            fi
            exit 1
          fi

          # Fall D: Routing fehlt
          if [ "${ROUTE}" != "OK" ]; then
            echo "Ergebnis: D - Routing zur CCU3 fehlt."
            echo "Pruefen: AllowedIPs muss 192.168.2.0/24 oder 0.0.0.0/0 enthalten."
            exit 1
          fi

          # Fall B: WireGuard und Handshake OK, aber kein TCP zur CCU3
          if [ "${TCP}" != "OK" ]; then
            echo "Ergebnis: B - WireGuard Handshake OK, aber kein TCP-Zugriff auf CCU3."
            echo "Moegliche Ursachen:"
            echo "  - CCU3 (192.168.2.109) ist im Heimnetz nicht erreichbar (ausgeschaltet?)."
            echo "  - Speedport leitet den Heimnetz-Traffic nicht zurueck zum WireGuard-Client."
            echo "  - MTU-Problem: Grosse Pakete werden fragmentiert oder verworfen."
            echo "  - Firewall auf CCU3 blockiert eingehende Verbindungen."
            exit 1
          fi

          if [ "${HMIP}" != "OK" ]; then
            CCU_REQUIRE_HMIP_PORT_NORMALIZED="$(printf '%s' "${CCU_REQUIRE_HMIP_PORT}" | tr '[:upper:]' '[:lower:]')"
            if [ "${CCU_REQUIRE_HMIP_PORT_NORMALIZED}" = "true" ]; then
              echo "Ergebnis: H - WireGuard Handshake OK, aber HmIP-Port ${CCU_HMIP_PORT} auf der CCU3 nicht erreichbar."
              echo "Pruefen:"
              echo "  - HmIP-Serverdienst auf der CCU3 aktiv"
              echo "  - Lokale Firewall/Filter auf der CCU3"
              echo "  - Richtiger Port (Standard 2010)"
              exit 1
            fi
            echo "::warning::HmIP-Port ${CCU_HMIP_PORT} nicht erreichbar, aber nicht als Fehler gewertet."
          fi

          if [ "${XMLAPI}" != "OK" ]; then
            echo "Ergebnis: X - WireGuard und HmIP-Port OK, aber XML-API Add-on antwortet nicht gueltig."
            echo "Pruefen:"
            echo "  - Add-on XML-API ist auf der CCU3 installiert und aktiv"
            echo "  - CCU_XMLAPI_PATH ist korrekt (Standard: /addons/xmlapi/statelist.cgi)"
            echo "  - Falls WebUI abgesichert ist: Secrets CCU_XMLAPI_USER/CCU_XMLAPI_PASSWORD setzen"
            exit 1
          fi

          CCU_REQUIRE_KEYPAD_MATCH_NORMALIZED="$(printf '%s' "${CCU_REQUIRE_KEYPAD_MATCH}" | tr '[:upper:]' '[:lower:]')"
          if [ "${KEYPAD}" != "OK" ]; then
            if [ "${CCU_REQUIRE_KEYPAD_MATCH_NORMALIZED}" = "true" ]; then
              echo "Ergebnis: K - Keypad-Daten konnten nicht verifiziert werden (Regex/Match fehlt)."
              echo "Pruefen:"
              echo "  - CCU_KEYPAD_MATCH_REGEX auf Name/Typ/Adresse des Keypads anpassen"
              echo "  - XML-API devicelist/statelist enthalten das Keypad"
              exit 1
            fi
            echo "::warning::Keypad-Daten nicht verifiziert, aber nicht erzwungen (CCU_REQUIRE_KEYPAD_MATCH=false)."
          fi

          echo "Ergebnis: Unbekannter Fehler. Bitte Logs pruefen."
          exit 1

      - name: Cleanup WireGuard and temporary files
        if: ${{ always() }}
        run: |
          set +e
          if ip link show "${WG_INTERFACE}" >/dev/null 2>&1; then
            sudo wg-quick down "${WG_CONFIG_PATH}" || true
          fi
          rm -f "${WG_CONFIG_PATH}"
