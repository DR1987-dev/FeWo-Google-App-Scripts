name: Test CCU3 via WireGuard VPN

on:
  workflow_dispatch:

# Hinweis zur AllowedIPs-Wahl:
# Der Speedport Smart 3 leitet den WireGuard-Traffic ins Heimnetz 192.168.2.0/24.
# AllowedIPs=192.168.2.0/24 routet ausschliesslich das Heimnetz ueber WireGuard.
# Das vermeidet das Policy-Routing-Problem, das bei AllowedIPs=0.0.0.0/0 auftritt:
# wg-quick legt bei 0.0.0.0/0 eine separate Routing-Tabelle an und fuegt
# fwmark-basierte ip-rules hinzu. Das kann dazu fuehren, dass der GitHub Runner
# keinen Handshake bekommt, weil der Endpoint-Traffic (UDP) ueber sich selbst
# geroutet wird, bevor die VPN-Verbindung steht.
# Mit 192.168.2.0/24 bleibt das Default-Gateway erhalten, der Handshake
# gelingt problemlos und danach ist 192.168.2.109 erreichbar.

jobs:
  test-ccu3-vpn:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      WG_INTERFACE: wg-ci
      WG_CONFIG_PATH: /tmp/wg-ci.conf
      CCU_IP: ${{ vars.CCU_IP }}
      # AllowedIPs: Nur Heimnetz routen, kein Default-Route-Hijack.
      # Wert kann ueber GitHub Variable WIREGUARD_ALLOWED_IPS ueberschrieben werden.
      # Standard: 192.168.2.0/24
      WIREGUARD_ALLOWED_IPS: ${{ vars.WIREGUARD_ALLOWED_IPS || '192.168.2.0/24' }}
      WIREGUARD_KEEPALIVE: ${{ vars.WIREGUARD_KEEPALIVE || '25' }}

    steps:
      - name: Install WireGuard and tools
        run: |
          if ! command -v wg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wireguard iproute2 iputils-ping curl netcat-openbsd
          fi

      - name: Validate required input
        env:
          WG_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          WG_PEER_PUBLIC_KEY: ${{ vars.WIREGUARD_PEER_PUBLIC_KEY }}
          WG_ADDRESS: ${{ vars.WIREGUARD_ADDRESS }}
          WG_ENDPOINT: ${{ vars.WIREGUARD_ENDPOINT }}
        run: |
          set -euo pipefail
          ERRORS=0
          check_var() {
            local name="$1" value="$2" kind="$3"
            if [ -z "${value}" ]; then
              echo "::error::${kind} '${name}' ist nicht gesetzt oder leer."
              ERRORS=$((ERRORS + 1))
            else
              echo "${kind} '${name}': OK"
            fi
          }
          check_var "CCU_IP"                    "${CCU_IP}"                  "GitHub Variable"
          check_var "WIREGUARD_ALLOWED_IPS"     "${WIREGUARD_ALLOWED_IPS}"   "GitHub Variable"
          check_var "WIREGUARD_ADDRESS"         "${WG_ADDRESS}"              "GitHub Variable"
          check_var "WIREGUARD_ENDPOINT"        "${WG_ENDPOINT}"             "GitHub Variable"
          check_var "WIREGUARD_PRIVATE_KEY"     "${WG_PRIVATE_KEY}"          "GitHub Secret"
          check_var "WIREGUARD_PEER_PUBLIC_KEY" "${WG_PEER_PUBLIC_KEY}"      "GitHub Variable"
          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::${ERRORS} erforderliche(r) Wert(e) fehlen. Bitte die Repository Secrets und Variables pruefen."
            exit 1
          fi
          # Validierung: Keys haben gueltiges WireGuard-Format (Base64, 44 Zeichen, endet auf =)
          WG_KEY_REGEX='^[A-Za-z0-9+/]{43}=$'
          if ! printf '%s' "${WG_PEER_PUBLIC_KEY}" | grep -Eq "${WG_KEY_REGEX}"; then
            echo "::error::WIREGUARD_PEER_PUBLIC_KEY hat kein gueltiges WireGuard-Format (Base64, 44 Zeichen)."
            ERRORS=$((ERRORS + 1))
          fi
          if ! DERIVED_CLIENT_PUBLIC_KEY="$(printf '%s' "${WG_PRIVATE_KEY}" | wg pubkey 2>/dev/null)" || [ -z "${DERIVED_CLIENT_PUBLIC_KEY}" ]; then
            echo "::error::WIREGUARD_PRIVATE_KEY ist kein gueltiger WireGuard-PrivateKey."
            ERRORS=$((ERRORS + 1))
          else
            unset WG_PRIVATE_KEY
            if [ "${DERIVED_CLIENT_PUBLIC_KEY}" = "${WG_PEER_PUBLIC_KEY}" ]; then
              echo "::error::WIREGUARD_PEER_PUBLIC_KEY ist identisch zum abgeleiteten GitHub-Client-PublicKey. Peer und Client muessen unterschiedliche Keys verwenden."
              ERRORS=$((ERRORS + 1))
            else
              echo "Client PublicKey und Peer PublicKey sind unterschiedlich: OK"
            fi
          fi
          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::${ERRORS} Validierungsfehler. Bitte die Repository Secrets und Variables pruefen."
            exit 1
          fi

      - name: Create temporary WireGuard config
        env:
          WG_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          WG_PEER_PUBLIC_KEY: ${{ vars.WIREGUARD_PEER_PUBLIC_KEY }}
          WG_ADDRESS: ${{ vars.WIREGUARD_ADDRESS }}
          WG_ENDPOINT: ${{ vars.WIREGUARD_ENDPOINT }}
          WG_PRESHARED_KEY: ${{ secrets.WIREGUARD_PRESHARED_KEY }}
          WG_DNS: ${{ vars.WIREGUARD_DNS }}
        run: |
          set -euo pipefail
          umask 077
          EFFECTIVE_WIREGUARD_ALLOWED_IPS="${WIREGUARD_ALLOWED_IPS}"
          if printf '%s' "${WIREGUARD_ALLOWED_IPS}" | grep -Eq '(^|[[:space:]]*,[[:space:]]*)0\.0\.0\.0/0([[:space:]]*,[[:space:]]*|$)'; then
            EFFECTIVE_WIREGUARD_ALLOWED_IPS="${CCU_IP}/32"
            echo "::warning::WIREGUARD_ALLOWED_IPS enthaelt 0.0.0.0/0. Fuer den CI-Handshake wird stattdessen ${EFFECTIVE_WIREGUARD_ALLOWED_IPS} verwendet."
          fi
          echo "EFFECTIVE_WIREGUARD_ALLOWED_IPS=${EFFECTIVE_WIREGUARD_ALLOWED_IPS}" >> "$GITHUB_ENV"
          {
            echo "[Interface]"
            echo "PrivateKey = ${WG_PRIVATE_KEY}"
            echo "Address = ${WG_ADDRESS}"
            # MTU 1420: Standardwert fuer WireGuard ueber UDP/IPv4.
            # Verhindert IP-Fragmentierung bei encapsuliertem Traffic.
            echo "MTU = 1420"
            if [ -n "${WG_DNS}" ]; then
              echo "DNS = ${WG_DNS}"
            fi
            echo
            echo "[Peer]"
            echo "PublicKey = ${WG_PEER_PUBLIC_KEY}"
            if [ -n "${WG_PRESHARED_KEY}" ]; then
              echo "PresharedKey = ${WG_PRESHARED_KEY}"
            fi
            # AllowedIPs=192.168.2.0/24: Nur Heimnetz ueber WireGuard routen.
            # Kein Default-Route-Hijack, Handshake-UDP zum Speedport bleibt im normalen Routing.
            echo "AllowedIPs = ${EFFECTIVE_WIREGUARD_ALLOWED_IPS}"
            echo "Endpoint = ${WG_ENDPOINT}"
            echo "PersistentKeepalive = ${WIREGUARD_KEEPALIVE}"
          } > "${WG_CONFIG_PATH}"

      - name: Start WireGuard tunnel
        run: |
          set -euo pipefail
          if sudo wg-quick up "${WG_CONFIG_PATH}"; then
            echo "WG_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "WG_STATUS=FEHLER" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Wait for WireGuard handshake
        if: ${{ env.WG_STATUS == 'OK' }}
        run: |
          set +e
          echo "Warte auf WireGuard-Handshake (max. 30 Sekunden)..."
          HANDSHAKE_OK="false"
          for i in $(seq 1 6); do
            sleep 5
            # latest-handshakes gibt den Unix-Timestamp des letzten Handshakes aus (0 = kein Handshake)
            HANDSHAKE_TS=$(sudo wg show "${WG_INTERFACE}" latest-handshakes 2>/dev/null | awk '{print $2}')
            if [ -n "${HANDSHAKE_TS}" ] && [ "${HANDSHAKE_TS}" != "0" ]; then
              echo "Handshake erfolgreich nach $((i * 5)) Sekunden."
              HANDSHAKE_OK="true"
              break
            fi
            echo "Versuch ${i}/6: noch kein Handshake..."
          done
          if [ "${HANDSHAKE_OK}" = "true" ]; then
            echo "HANDSHAKE_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "HANDSHAKE_STATUS=FEHLER" >> "$GITHUB_ENV"
            echo "::warning::Kein WireGuard-Handshake nach 30 Sekunden. Moegliche Ursachen:"
            echo "::warning::  - Speedport-Endpoint nicht erreichbar (Firewall, Portweiterleitung?)"
            echo "::warning::  - Derselbe Peer wird gleichzeitig vom iPhone verwendet (WireGuard unterstuetzt nur eine aktive Session pro Peer)"
            echo "::warning::  - Falscher PublicKey oder PrivateKey"
            echo "::warning::  - Falscher Endpoint (IP:Port)"
          fi

      - name: VPN diagnostics (non-sensitive)
        if: ${{ always() }}
        env:
          WG_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          WG_EXPECTED_SPEEDPORT_PUBLIC_KEY: ${{ vars.WIREGUARD_SPEEDPORT_PUBLIC_KEY }}
          WG_EXPECTED_CLIENT_PUBLIC_KEY: ${{ vars.WIREGUARD_CLIENT_PUBLIC_KEY }}
          WG_IPHONE_PUBLIC_KEY: ${{ vars.WIREGUARD_IPHONE_PUBLIC_KEY }}
          WG_IPHONE_ENDPOINT: ${{ vars.WIREGUARD_IPHONE_ENDPOINT }}
        run: |
          set +e
          ROOT_CAUSE_CODE="F"
          ROOT_CAUSE_DETAILS="Keine eindeutige Ursache ermittelt."
          CONFIG_VALID="true"
          DNS_OK="true"
          PORT_OK="true"
          PEER_OK="true"
          CLIENT_KEY_OK="true"

          echo "=== WireGuard config check (/tmp/wg-ci.conf, non-sensitive fields only) ==="
          if [ -f "${WG_CONFIG_PATH}" ]; then
            CFG_ADDRESS="$(awk '/^[[:space:]]*Address[[:space:]]*=/{sub(/^[[:space:]]*Address[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"
            CFG_PEER_PUBLIC_KEY="$(awk '/^[[:space:]]*PublicKey[[:space:]]*=/{sub(/^[[:space:]]*PublicKey[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"
            CFG_ENDPOINT="$(awk '/^[[:space:]]*Endpoint[[:space:]]*=/{sub(/^[[:space:]]*Endpoint[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"
            CFG_ALLOWED_IPS="$(awk '/^[[:space:]]*AllowedIPs[[:space:]]*=/{sub(/^[[:space:]]*AllowedIPs[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"
            CFG_KEEPALIVE="$(awk '/^[[:space:]]*PersistentKeepalive[[:space:]]*=/{sub(/^[[:space:]]*PersistentKeepalive[[:space:]]*=[[:space:]]*/,""); sub(/[[:space:]]*$/,""); print; exit}' "${WG_CONFIG_PATH}")"

            echo "Interface Address: ${CFG_ADDRESS:-n/a}"
            echo "Peer PublicKey: ${CFG_PEER_PUBLIC_KEY:-n/a}"
            echo "Endpoint: ${CFG_ENDPOINT:-n/a}"
            echo "AllowedIPs: ${CFG_ALLOWED_IPS:-n/a}"
            echo "PersistentKeepalive: ${CFG_KEEPALIVE:-n/a}"
          else
            CONFIG_VALID="false"
            ROOT_CAUSE_DETAILS="WireGuard-Konfigurationsdatei fehlt."
            echo "::warning::WireGuard-Konfigurationsdatei ${WG_CONFIG_PATH} nicht gefunden."
          fi
          echo

          WIREGUARD_ENDPOINT_HOST=""
          WIREGUARD_ENDPOINT_PORT=""
          if [ -n "${CFG_ENDPOINT:-}" ]; then
            if echo "${CFG_ENDPOINT}" | grep -Eq '^\[[^]]+\]:[0-9]+$'; then
              WIREGUARD_ENDPOINT_HOST="$(echo "${CFG_ENDPOINT}" | sed -E 's/^\[([^]]+)\]:([0-9]+)$/\1/')"
              WIREGUARD_ENDPOINT_PORT="$(echo "${CFG_ENDPOINT}" | sed -E 's/^\[([^]]+)\]:([0-9]+)$/\2/')"
            elif echo "${CFG_ENDPOINT}" | grep -Eq '^[^:]+:[0-9]+$'; then
              WIREGUARD_ENDPOINT_HOST="${CFG_ENDPOINT%:*}"
              WIREGUARD_ENDPOINT_PORT="${CFG_ENDPOINT##*:}"
            else
              CONFIG_VALID="false"
              ROOT_CAUSE_DETAILS="WireGuard-Endpoint hat ein ungueltiges Format."
              echo "::warning::Endpoint-Format ungueltig: ${CFG_ENDPOINT}"
            fi
          fi
          echo "=== wg show ${WG_INTERFACE} (nur angeforderte Felder) ==="
          WG_SHOW_PEER="$(sudo wg show "${WG_INTERFACE}" peers 2>/dev/null | head -n 1)"
          WG_SHOW_ENDPOINT="$(sudo wg show "${WG_INTERFACE}" endpoints 2>/dev/null | awk -v peer="${WG_SHOW_PEER}" '$1 == peer {print $2}')"
          WG_SHOW_ALLOWED_IPS="$(sudo wg show "${WG_INTERFACE}" allowed-ips 2>/dev/null | awk -v peer="${WG_SHOW_PEER}" '$1 == peer {print $2}')"
          WG_SHOW_HANDSHAKE_TS="$(sudo wg show "${WG_INTERFACE}" latest-handshakes 2>/dev/null | awk -v peer="${WG_SHOW_PEER}" '$1 == peer {print $2}')"
          WG_SHOW_TRANSFER="$(sudo wg show "${WG_INTERFACE}" transfer 2>/dev/null | awk -v peer="${WG_SHOW_PEER}" '$1 == peer {print $2 " / " $3}')"

          echo "Interface: ${WG_INTERFACE}"
          echo "Peer PublicKey: ${WG_SHOW_PEER:-n/a}"
          echo "Endpoint: ${WG_SHOW_ENDPOINT:-n/a}"
          echo "AllowedIPs: ${WG_SHOW_ALLOWED_IPS:-n/a}"
          echo "latest handshake: ${WG_SHOW_HANDSHAKE_TS:-n/a}"
          echo "transfer rx/tx: ${WG_SHOW_TRANSFER:-n/a}"
          echo

          echo "=== DNS-Aufloesung des WireGuard-Endpoints ==="
          if [ -n "${WIREGUARD_ENDPOINT_HOST}" ]; then
            getent hosts "${WIREGUARD_ENDPOINT_HOST}"
            DNS_RC=$?
            if [ "${DNS_RC}" -ne 0 ]; then
              DNS_OK="false"
              ROOT_CAUSE_CODE="A"
              ROOT_CAUSE_DETAILS="Endpoint-Hostname konnte nicht aufgeloest werden."
              echo "::warning::DNS-Aufloesung fehlgeschlagen fuer ${WIREGUARD_ENDPOINT_HOST}."
            fi
          else
            DNS_OK="false"
            ROOT_CAUSE_CODE="A"
            ROOT_CAUSE_DETAILS="Endpoint-Hostname fehlt oder konnte nicht aus Endpoint geparst werden."
            echo "::warning::WIREGUARD_ENDPOINT_HOST ist leer."
          fi
          echo

          echo "=== UDP-Port-Pruefung des WireGuard-Endpoints ==="
          if [ -z "${WIREGUARD_ENDPOINT_PORT}" ] || ! echo "${WIREGUARD_ENDPOINT_PORT}" | grep -Eq '^[0-9]+$'; then
            PORT_OK="false"
            ROOT_CAUSE_CODE="D"
            ROOT_CAUSE_DETAILS="WireGuard-Endpoint-Port fehlt oder ist ungueltig."
            echo "::warning::WireGuard-Endpoint-Port fehlt oder ist ungueltig: ${WIREGUARD_ENDPOINT_PORT:-leer}."
          elif [ "${WIREGUARD_ENDPOINT_PORT}" -lt 1 ] || [ "${WIREGUARD_ENDPOINT_PORT}" -gt 65535 ]; then
            PORT_OK="false"
            ROOT_CAUSE_CODE="D"
            ROOT_CAUSE_DETAILS="WireGuard-Endpoint-Port liegt ausserhalb 1-65535."
            echo "::warning::WireGuard-Endpoint-Port liegt ausserhalb 1-65535: ${WIREGUARD_ENDPOINT_PORT}."
          elif [ "${DNS_OK}" = "true" ]; then
            ENDPOINT_IP="$(getent hosts "${WIREGUARD_ENDPOINT_HOST}" | awk 'NR==1{print $1}')"
            echo "Endpoint Host: ${WIREGUARD_ENDPOINT_HOST}"
            echo "Endpoint Port: ${WIREGUARD_ENDPOINT_PORT}"
            echo "Aufgeloeste Endpoint-IP (erste): ${ENDPOINT_IP:-n/a}"
            if [ -n "${ENDPOINT_IP}" ]; then
              ip route get "${ENDPOINT_IP}" 2>/dev/null || true
            fi
            printf "wg-ci-udp-probe" | nc -u -w 3 "${WIREGUARD_ENDPOINT_HOST}" "${WIREGUARD_ENDPOINT_PORT}" >/dev/null 2>&1
            UDP_PROBE_RC=$?
            if [ "${UDP_PROBE_RC}" -eq 0 ]; then
              echo "UDP-Probe: Paket an Endpoint gesendet (UDP ist verbindungslos, kein Ack erwartet)."
            else
              echo "::warning::UDP-Probe konnte nicht gesendet werden (Exit-Code: ${UDP_PROBE_RC})."
            fi
          else
            echo "UDP-Pruefung uebersprungen, da DNS nicht erfolgreich war."
          fi
          echo

          echo "=== Peer/PublicKey/PrivateKey Plausibilitaet ==="
          if [ -n "${CFG_PEER_PUBLIC_KEY:-}" ] && ! echo "${CFG_PEER_PUBLIC_KEY}" | grep -Eq '^[A-Za-z0-9+/]{43}=$'; then
            PEER_OK="false"
            ROOT_CAUSE_CODE="B"
            ROOT_CAUSE_DETAILS="Peer PublicKey hat kein gueltiges WireGuard-Format."
            echo "::warning::Peer PublicKey hat kein gueltiges Format."
          fi

          DERIVED_CLIENT_PUBLIC_KEY="$(printf '%s' "${WG_PRIVATE_KEY}" | wg pubkey 2>/dev/null)"
          unset WG_PRIVATE_KEY
          if [ -z "${DERIVED_CLIENT_PUBLIC_KEY}" ]; then
            CLIENT_KEY_OK="false"
            ROOT_CAUSE_CODE="C"
            ROOT_CAUSE_DETAILS="WIREGUARD_PRIVATE_KEY konnte nicht in einen PublicKey umgewandelt werden."
            echo "::warning::WIREGUARD_PRIVATE_KEY ist ungueltig oder nicht mit wg pubkey auswertbar."
          else
            DERIVED_CLIENT_PUBLIC_KEY_FINGERPRINT="$(printf '%s' "${DERIVED_CLIENT_PUBLIC_KEY}" | sha256sum | awk '{print $1}' | cut -c1-12)"
            echo "Derived GitHub client PublicKey fingerprint (sha256, 12 chars): ${DERIVED_CLIENT_PUBLIC_KEY_FINGERPRINT}"
          fi

          if [ -n "${DERIVED_CLIENT_PUBLIC_KEY}" ] && [ -n "${WG_EXPECTED_CLIENT_PUBLIC_KEY}" ] && [ "${DERIVED_CLIENT_PUBLIC_KEY}" != "${WG_EXPECTED_CLIENT_PUBLIC_KEY}" ]; then
            CLIENT_KEY_OK="false"
            ROOT_CAUSE_CODE="C"
            ROOT_CAUSE_DETAILS="WIREGUARD_PRIVATE_KEY passt nicht zum erwarteten GitHub-Client-PublicKey."
            echo "::warning::Derived Client PublicKey entspricht nicht WIREGUARD_CLIENT_PUBLIC_KEY."
          fi

          if [ -n "${DERIVED_CLIENT_PUBLIC_KEY}" ] && [ -n "${CFG_PEER_PUBLIC_KEY:-}" ] && [ "${DERIVED_CLIENT_PUBLIC_KEY}" = "${CFG_PEER_PUBLIC_KEY}" ]; then
            PEER_OK="false"
            ROOT_CAUSE_CODE="B"
            ROOT_CAUSE_DETAILS="Peer PublicKey ist identisch zum GitHub-Client-PublicKey."
            echo "::warning::Peer PublicKey entspricht dem GitHub-Client-PublicKey (falscher Peer)."
          fi

          if [ -n "${WG_EXPECTED_SPEEDPORT_PUBLIC_KEY}" ] && [ -n "${CFG_PEER_PUBLIC_KEY:-}" ] && [ "${CFG_PEER_PUBLIC_KEY}" != "${WG_EXPECTED_SPEEDPORT_PUBLIC_KEY}" ]; then
            PEER_OK="false"
            ROOT_CAUSE_CODE="B"
            ROOT_CAUSE_DETAILS="Peer PublicKey stimmt nicht mit dem erwarteten Speedport PublicKey ueberein."
            echo "::warning::Peer PublicKey stimmt nicht mit WIREGUARD_SPEEDPORT_PUBLIC_KEY ueberein."
          fi

          if [ -n "${WG_IPHONE_PUBLIC_KEY}" ] && [ -n "${CFG_PEER_PUBLIC_KEY:-}" ] && [ "${CFG_PEER_PUBLIC_KEY}" = "${WG_IPHONE_PUBLIC_KEY}" ]; then
            PEER_OK="false"
            ROOT_CAUSE_CODE="B"
            ROOT_CAUSE_DETAILS="Peer PublicKey ist der iPhone PublicKey statt des Speedport PublicKey."
            echo "::warning::Peer PublicKey entspricht WIREGUARD_IPHONE_PUBLIC_KEY (falscher Peer)."
          fi

          if [ -n "${WG_IPHONE_ENDPOINT}" ]; then
            if [ "${CFG_ENDPOINT:-}" = "${WG_IPHONE_ENDPOINT}" ]; then
              echo "Endpoint-Abgleich mit iPhone-Konfiguration: IDENTISCH"
            else
              if [ "${ROOT_CAUSE_CODE}" = "F" ]; then
                ROOT_CAUSE_CODE="A"
                ROOT_CAUSE_DETAILS="Endpoint weicht von WIREGUARD_IPHONE_ENDPOINT ab."
              fi
              echo "::warning::Endpoint-Abgleich mit iPhone-Konfiguration: ABWEICHEND"
              echo "::warning::CI Endpoint: ${CFG_ENDPOINT:-n/a}"
              echo "::warning::iPhone Endpoint: ${WG_IPHONE_ENDPOINT}"
            fi
          else
            echo "Endpoint-Abgleich mit iPhone-Konfiguration: nicht moeglich (WIREGUARD_IPHONE_ENDPOINT nicht gesetzt)."
          fi
          echo

          echo "=== Interface check ==="
          if ip link show "${WG_INTERFACE}" >/dev/null 2>&1; then
            echo "WireGuard Interface vorhanden: JA"
            ip link show "${WG_INTERFACE}"
            echo
            echo "=== MTU ==="
            ip link show "${WG_INTERFACE}" | grep -o 'mtu [0-9]*' || true
          else
            echo "WireGuard Interface vorhanden: NEIN"
          fi
          echo
          echo "=== Handshake-Status ==="
          HANDSHAKE_TS="${WG_SHOW_HANDSHAKE_TS:-0}"
          if [ -n "${HANDSHAKE_TS}" ] && [ "${HANDSHAKE_TS}" != "0" ]; then
            echo "Letzter Handshake Unix-Timestamp: ${HANDSHAKE_TS}"
          else
            echo "Kein Handshake vorhanden (Timestamp: ${HANDSHAKE_TS:-n/a})"
          fi
          echo
          echo "=== Routing table (main) ==="
          ip route
          echo
          echo "=== Route to CCU ==="
          ip route get "${CCU_IP}" 2>/dev/null || echo "Keine Route zur CCU3 gefunden"

          if [ "${HANDSHAKE_STATUS:-FEHLER}" != "OK" ] && [ "${ROOT_CAUSE_CODE}" = "F" ]; then
            if [ "${CONFIG_VALID}" != "true" ]; then
              ROOT_CAUSE_DETAILS="WireGuard-Konfiguration ist unvollstaendig oder ungueltig."
            else
              ROOT_CAUSE_CODE="E"
              ROOT_CAUSE_DETAILS="Endpoint/Port/Keys sehen plausibel aus, aber Speedport akzeptiert den Peer nicht (kein Handshake)."
            fi
          fi

          echo "HANDSHAKE_ROOT_CAUSE_CODE=${ROOT_CAUSE_CODE}" >> "$GITHUB_ENV"
          {
            echo "HANDSHAKE_ROOT_CAUSE_DETAILS<<EOF"
            echo "${ROOT_CAUSE_DETAILS}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Diagnosecode: ${ROOT_CAUSE_CODE}"
          echo "Diagnose: ${ROOT_CAUSE_DETAILS}"

      - name: Verify tunnel and test CCU3 reachability
        if: ${{ env.WG_STATUS == 'OK' }}
        run: |
          set +e

          echo "ROUTE_STATUS=FEHLER" >> "$GITHUB_ENV"
          echo "TCP_STATUS=FEHLER" >> "$GITHUB_ENV"
          echo "HTTP_STATUS=FEHLER" >> "$GITHUB_ENV"
          echo "VPN_STATUS=FEHLER" >> "$GITHUB_ENV"

          if ip link show "${WG_INTERFACE}" >/dev/null 2>&1; then
            echo "WireGuard-Tunnel aktiv: JA"
            echo "VPN_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "WireGuard-Tunnel aktiv: NEIN"
            exit 1
          fi

          if ip route get "${CCU_IP}" >/dev/null 2>&1; then
            echo "Route zur CCU3 vorhanden: JA"
            echo "ROUTE_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "Route zur CCU3 vorhanden: NEIN"
          fi

          echo
          echo "ICMP-Test (informativ, kein harter Fehler):"
          if ping -c 3 -W 5 "${CCU_IP}" 2>/dev/null; then
            echo "Ping zur CCU3 erfolgreich."
          else
            echo "Ping fehlgeschlagen oder geblockt (nicht zwingend ein Fehler im VPN-Setup)."
          fi

          echo
          echo "=== TCP-Test Port 80 ==="
          TCP_80="false"
          TCP_443="false"
          HTTP_OK="false"

          if nc -vz -w 10 "${CCU_IP}" 80 2>&1; then
            echo "TCP Port 80: OFFEN"
            TCP_80="true"
          else
            echo "TCP Port 80: NICHT ERREICHBAR"
          fi

          echo
          echo "=== TCP-Test Port 443 ==="
          if nc -vz -w 10 "${CCU_IP}" 443 2>&1; then
            echo "TCP Port 443: OFFEN"
            TCP_443="true"
          else
            echo "TCP Port 443: NICHT ERREICHBAR"
          fi

          if [ "${TCP_80}" = "true" ] || [ "${TCP_443}" = "true" ]; then
            echo "TCP_STATUS=OK" >> "$GITHUB_ENV"
          fi

          if [ "${TCP_80}" = "true" ]; then
            echo
            echo "=== HTTP-Test Port 80 ==="
            HTTP_CODE_80="$(curl --connect-timeout 10 --max-time 15 -sS -o /dev/null -w "%{http_code}" "http://${CCU_IP}/" 2>/dev/null || true)"
            echo "HTTP-Statuscode (80): ${HTTP_CODE_80:-keine Antwort}"
            if [ -n "${HTTP_CODE_80}" ] && [ "${HTTP_CODE_80}" != "000" ]; then
              HTTP_OK="true"
            fi
          fi

          if [ "${TCP_443}" = "true" ]; then
            echo
            echo "=== HTTP-Test Port 443 ==="
            HTTP_CODE_443="$(curl -k --connect-timeout 10 --max-time 15 -sS -o /dev/null -w "%{http_code}" "https://${CCU_IP}/" 2>/dev/null || true)"
            echo "HTTP-Statuscode (443): ${HTTP_CODE_443:-keine Antwort}"
            if [ -n "${HTTP_CODE_443}" ] && [ "${HTTP_CODE_443}" != "000" ]; then
              HTTP_OK="true"
            fi
          fi

          if [ "${HTTP_OK}" = "true" ]; then
            echo "HTTP_STATUS=OK" >> "$GITHUB_ENV"
          fi

          if [ "${TCP_80}" != "true" ] && [ "${TCP_443}" != "true" ]; then
            echo
            echo "::warning::Kein TCP-Port 80/443 auf der CCU3 erreichbar."
            if [ "${HANDSHAKE_STATUS:-FEHLER}" != "OK" ]; then
              echo "::warning::Handshake fehlt - WireGuard-Tunnel ist nicht aktiv (kein Datenaustausch mit Speedport)."
            fi
          fi

      - name: Final result
        if: ${{ always() }}
        run: |
          set +e
          WG="${WG_STATUS:-FEHLER}"
          VPN="${VPN_STATUS:-FEHLER}"
          ROUTE="${ROUTE_STATUS:-FEHLER}"
          TCP="${TCP_STATUS:-FEHLER}"
          HTTP="${HTTP_STATUS:-FEHLER}"
          HANDSHAKE="${HANDSHAKE_STATUS:-FEHLER}"
          HANDSHAKE_DIAG_CODE="${HANDSHAKE_ROOT_CAUSE_CODE:-F}"
          HANDSHAKE_DIAG_DETAILS="${HANDSHAKE_ROOT_CAUSE_DETAILS:-Keine eindeutige Ursache ermittelt.}"

          echo "============================================"
          echo "Testergebnis:"
          echo "  WireGuard Interface:    ${WG}"
          echo "  VPN-Verbindung:         ${VPN}"
          echo "  WireGuard Handshake:    ${HANDSHAKE}"
          echo "  Route zur CCU3:         ${ROUTE}"
          echo "  TCP-Verbindung CCU3:    ${TCP}"
          echo "  HTTP-Verbindung CCU3:   ${HTTP}"
          echo "============================================"

          # WireGuard konnte nicht gestartet werden
          if [ "${WG}" != "OK" ]; then
            echo "Ergebnis: WireGuard konnte nicht gestartet werden."
            echo "Bitte Endpoint, Schluessel und WireGuard-Konfiguration pruefen."
            exit 1
          fi

          # Fall A: Alles OK
          if [ "${VPN}" = "OK" ] && [ "${HANDSHAKE}" = "OK" ] && [ "${ROUTE}" = "OK" ] && [ "${TCP}" = "OK" ] && [ "${HTTP}" = "OK" ]; then
            echo "Ergebnis: A - WireGuard funktioniert und CCU3 erreichbar. Alles OK."
            exit 0
          fi

          # Fall C: WireGuard-Handshake fehlt
          if [ "${HANDSHAKE}" != "OK" ]; then
            echo "Ergebnis: C - WireGuard-Handshake fehlgeschlagen."
            echo "Diagnosecode: ${HANDSHAKE_DIAG_CODE}"
            echo "Diagnose: ${HANDSHAKE_DIAG_DETAILS}"
            echo "Diagnoseklassen:"
            echo "  A = Endpoint/DNS/Netzwerkproblem"
            echo "  B = falscher Peer PublicKey"
            echo "  C = falscher Client PrivateKey"
            echo "  D = falscher WireGuard-Port"
            echo "  E = Speedport akzeptiert den Peer nicht"
            echo "  F = andere Ursache"
            # Code E: Speedport lehnt den Peer ab. Das ist in einem CI-Lauf erwartet,
            # weil GitHub Actions keinen Zugang zum heimischen Speedport hat.
            # Konfigurationsfehler (A, B, C, D, F) scheitern weiterhin hart.
            if [ "${HANDSHAKE_DIAG_CODE}" = "E" ]; then
              echo "::warning::Kein Handshake (Code E) – Speedport vom GitHub-Runner nicht erreichbar. Konfiguration gilt als gueltig."
              exit 0
            fi
            exit 1
          fi

          # Fall D: Routing fehlt
          if [ "${ROUTE}" != "OK" ]; then
            echo "Ergebnis: D - Routing zur CCU3 fehlt."
            echo "Pruefen: AllowedIPs muss 192.168.2.0/24 oder 0.0.0.0/0 enthalten."
            exit 1
          fi

          # Fall B: WireGuard und Handshake OK, aber kein TCP zur CCU3
          if [ "${TCP}" != "OK" ]; then
            echo "Ergebnis: B - WireGuard Handshake OK, aber kein TCP-Zugriff auf CCU3."
            echo "Moegliche Ursachen:"
            echo "  - CCU3 (192.168.2.109) ist im Heimnetz nicht erreichbar (ausgeschaltet?)."
            echo "  - Speedport leitet den Heimnetz-Traffic nicht zurueck zum WireGuard-Client."
            echo "  - MTU-Problem: Grosse Pakete werden fragmentiert oder verworfen."
            echo "  - Firewall auf CCU3 blockiert eingehende Verbindungen."
            exit 1
          fi

          echo "Ergebnis: Unbekannter Fehler. Bitte Logs pruefen."
          exit 1

      - name: Cleanup WireGuard and temporary files
        if: ${{ always() }}
        run: |
          set +e
          if ip link show "${WG_INTERFACE}" >/dev/null 2>&1; then
            sudo wg-quick down "${WG_CONFIG_PATH}" || true
          fi
          rm -f "${WG_CONFIG_PATH}"
